version: "3.8"

services:
  opendesign-server:
    image: ghcr.io/nexu-io/open-design:latest
    container_name: opendesign-server
    labels:
      io.containers.autoupdate: registry
    environment:
      # Server configuration
      - OD_SERVER_PORT=3000
      - OD_SERVER_HOST=127.0.0.1
      # Database configuration (uses PostgreSQL from OpenDesign's built-in)
      - OD_DATABASE_URL=postgresql://opendesign:opendesign@localhost:5432/opendesign
      # Redis configuration
      - OD_REDIS_URL=redis://localhost:6379
      # Security
      - OD_SECRET_KEY=${OD_SECRET_KEY:-changeme}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - opendesign-data:/var/lib/opendesign
      - opendesign-config:/etc/opendesign
    networks:
      - opendesign-net
    restart: "no"  # systemd handles restarts

  postgres:
    image: postgres:16-alpine
    container_name: opendesign-postgres
    labels:
      io.containers.autoupdate: registry
    environment:
      - POSTGRES_DB=opendesign
      - POSTGRES_USER=opendesign
      - POSTGRES_PASSWORD=opendesign
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - opendesign-net
    restart: "no"

  redis:
    image: redis:7-alpine
    container_name: opendesign-redis
    labels:
      io.containers.autoupdate: registry
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - opendesign-net
    restart: "no"

volumes:
  opendesign-data:
  opendesign-config:
  postgres-data:
  redis-data:

networks:
  opendesign-net:
    driver: bridge
