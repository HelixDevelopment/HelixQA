  - id: HXC-TASK-014
    name: "Authenticated task lifecycle (create → assign → start → complete)"
    category: e2e
    priority: critical
    platforms: [api]
    steps:
      - name: "Full authenticated task CRUD + lifecycle"
        action: "Log in, create a task, assign it to a worker, start it, checkpoint it, complete it, and assert each state transition persisted in PostgreSQL"
        expected: "Each transition returns 2xx and the task row reflects the new state"
        _skip: true
        _skip_reason: "#HXC-029-REGISTER-BROKEN — no JWT can be minted in this offline bank (/api/v1/auth/register returns 400 internal create-user failure on a fresh DB), so the authenticated lifecycle cannot be driven here. Honest SKIP per Article XI §11.2.2 rather than a fabricated PASS; the 401 boundary cases (HXC-TASK-001..013) ARE machine-checked, and live execution against a seeded server covers the authenticated flow."
    tags: [task, lifecycle, e2e, auth, skip]
    estimated_duration: "5s"
    expected_result: "Authenticated lifecycle requires a mintable JWT; skipped honestly until register is fixed / DB seeded"
