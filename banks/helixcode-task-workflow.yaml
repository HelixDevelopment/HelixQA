version: "1.0"
name: "HelixCode Task & Workflow Lifecycle"
description: >-
  Self-driving (§11.4.98) HelixQA bank exercising HelixCode's task and project-
  workflow route surface. All task / workflow routes are auth-protected
  (tasks.Use / projects.Use authMiddleware in server.go), so every step here
  asserts the access-control boundary (401 without a bearer token) against the
  REAL route paths — including the task lifecycle verbs (assign/start/complete/
  fail/retry/checkpoint) and the four project workflow endpoints (planning/
  building/testing/refactoring). The authenticated CRUD + workflow-execution
  flow is an honest _skip because a JWT cannot be minted in this offline bank
  (register is broken on a fresh DB per HXC-029); live execution against a
  seeded server covers it. Routes verified against
  helix_code/internal/server/server.go.
metadata:
  author: vasic-digital
  app: HelixCode
  target_server: "HelixCode HTTP server (cmd/server) — real PostgreSQL + Redis backed"
  covenant: "§11.4.98 full-automation anti-bluff"
  route_source: "helix_code/internal/server/server.go tasks.* + projects.*/workflows/*"
  coverage_gap: "Authenticated task CRUD + workflow execution needs a mintable JWT — honest SKIP (HXC-029 register), not fabricated PASS"
test_cases:
  - id: HXC-TASK-001
    name: "List tasks requires auth (401)"
    category: security
    priority: critical
    platforms: [api]
    steps:
      - name: "GET /api/v1/tasks without auth"
        action: "http: GET /api/v1/tasks"
        expected: "401 Unauthorized"
        expect_status: 401
        expect_body_contains: "Authorization header required"
    tags: [task, security, protected]
    estimated_duration: "5s"
    expected_result: "Unauthenticated GET /api/v1/tasks is rejected with 401"

  - id: HXC-TASK-002
    name: "Create task requires auth (401)"
    category: security
    priority: critical
    platforms: [api]
    steps:
      - name: "POST /api/v1/tasks without auth"
        action: "http: POST /api/v1/tasks"
        expected: "401 Unauthorized"
        body:
          title: "boundary probe task"
        expect_status: 401
        expect_body_contains: "Authorization header required"
    tags: [task, security, protected]
    estimated_duration: "5s"
    expected_result: "Unauthenticated POST /api/v1/tasks is rejected with 401 (no task created)"

  - id: HXC-TASK-003
