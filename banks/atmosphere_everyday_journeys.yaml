# HelixQA Test Bank ADDITIONS — ATMOSphere Android 15 — EVERYDAY-USER JOURNEYS (J1–J7)
# Drafted 2026-06-03 by the everyday-user full-automation test-infrastructure stream.
#
# PURPOSE: §11.4.4(b) layer-4 (HelixQA Challenge) coverage for the everyday-user
#   journeys J1–J7 that replace human manual testers. Each Challenge dispatches to
#   the corresponding on-device journey script under
#   device/rockchip/rk3588/tests/everyday/ and scores PASS ONLY on the positive
#   captured evidence the journey writes (§11.4.5 / §11.4.13 / §11.4.68 / §11.4.69).
#   A bank entry without Challenge coverage is a §11.4 PASS-bluff; these close the
#   gap for the manual-equivalent journeys.
#
# RHYTHM: every journey runs in REGULAR and STRESS rhythm (RHYTHM env). The
#   STRESS rhythm runs the §11.4.85 storm slice (rapid reconfigure / switch /
#   seek). Both rhythms produce identical evidence shape; the Challenge dispatches
#   both via the host orchestrator scripts/testing/run_everyday_user_suite.sh.
#
# ANTI-BLUFF (§11.4.6): every Challenge dispatches to a REAL existing journey
#   script and scores on REAL evidence — no placeholder / fake Challenges. Apps
#   not installed / geo-blocked / no-secondary → SKIP-with-reason (never FAIL,
#   never fake-PASS). Native-player video that does not register a VOM decoder is
#   a captured RED finding (the framework reports it honestly), not a bluff.
#
# DO NOT MERGE BY EDITING THIS FILE INTO atmosphere.yaml MANUALLY — the conductor
#   merges these `test_cases:` items serially into the live bank's `test_cases:`
#   sequence to avoid §11.4.58 cross-PWU contention. This file is a staging draft.
#
# SCHEMA: matches atmosphere_additions_1_1_8.yaml / atmosphere_additions_20260530.yaml.

test_cases:

  # ==================== J1 YouTube everyday journey ====================
  - id: everyday.j1.youtube-browse-play-ad-cc-quality-rebuffer
    challenge_id: everyday.j1.youtube-browse-play-ad-cc-quality-rebuffer
    name: "YouTube everyday journey: browse → play → ad → CC → quality → switch → rebuffer with NO display flip, NO frozen frame, NO stuck cue [J1]"
    category: functional
    priority: critical
    platforms: [android]
    dispatches_to: "device/rockchip/rk3588/tests/everyday/j1_youtube.sh"
    domains: [video, subtitle, audio, secondary-display, youtube]
    required_evidence: [liveness-frame-advance-n3, not-stale-cross-check, no-primary-flash, subdebug-cc-candidate, arvus-codec-state, evidence-dir-non-empty]
    steps:
      - name: "Topology + geo + install gate (§11.4.3)"
        action: "Secondary HDMI present + YouTube installed + content server reachable; else SKIP-with-reason"
        expected: "Gates pass; missing secondary → SKIP topology_unsupported; geo-blocked → SKIP geo_restricted; absent app → SKIP hardware_not_present"
      - name: "Run J1 in REGULAR + STRESS rhythm (§11.4.50 N=3 regular)"
        action: "host: bash scripts/testing/run_everyday_user_suite.sh --journeys j1_youtube --rhythm both"
        expected: "Each step asserts §11.4.107 liveness (advancing frames on the routing display, not-stale-from-previous, no flash on the wrong display) + §11.4.69 audio sink + subtitle on the video display, not a stuck cue"
      - name: "Assert no display flip / no frozen frame across ad→content, quality, switch, rebuffer"
        action: "Liveness battery re-runs after every transition; STRESS storm repeats CC/quality/seek ×20"
        expected: "Video stays on its routing display through every transition; PASS only on captured liveness evidence; any flip-to-wrong-display or frozen frame is FAIL"
    tags: [video, subtitle, audio, secondary-display, youtube, "J1", "§11.4.5", "§11.4.69", "§11.4.85", "§11.4.107", video_display, subtitle_render, audio_output]
    documentation_refs:
      - type: test
        section: "J1 YouTube everyday journey"
        path: "device/rockchip/rk3588/tests/everyday/j1_youtube.sh"
      - type: plan
        section: "Phase G — full autonomous manual-equivalent testing (J1)"
        path: "qa-results/REMEDIATION_1.1.8_live_defects_20260603.md"
    estimated_duration: "5m"
    expected_result: "Video stays on its routing display through browse/play/ad/CC/quality/switch/rebuffer with advancing frames, no stuck caption, primary clean — captured §11.4.107 liveness + subdebug + Arvus evidence. PASS only on the captured evidence; flip/freeze/stuck-cue is FAIL; geo/topology/absent → SKIP."

