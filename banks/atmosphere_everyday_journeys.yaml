  # ==================== J6 Audio output switching matrix (label↔sink + no-silence) ====================
  - id: everyday.j6.audio-output-switch-matrix
    challenge_id: everyday.j6.audio-output-switch-matrix
    name: "Audio output switching matrix everyday journey: switch each sink → label matches REAL hardware + sound flows (no silence) + rapid-switch chaos [J6]"
    category: functional
    priority: critical
    platforms: [android]
    dispatches_to: "device/rockchip/rk3588/tests/everyday/j6_audio_switch.sh"
    domains: [audio, output-switch, hdmi, jack, usb, bt, label]
    required_evidence: [hw-ptr-delta-positive-per-sink, dumpsys-audio-device-labels, arvus-codec-state, no-crash-census, evidence-dir-non-empty]
    steps:
      - name: "Player + corpus gate (§11.4.6)"
        action: "A player + a local movie present to drive a real stream; else SKIP hardware_not_present"
        expected: "Gates pass or SKIP; never fake-PASS without a real stream"
      - name: "Switch each output sink → assert sound flows (no silence)"
        action: "host: bash scripts/testing/run_everyday_user_suite.sh --journeys j6_audio_switch --rhythm both"
        expected: "For each sink: /proc/asound/cardN hw_ptr delta > 0 proves sound flowing; Arvus host-side codec-state cross-check for HDMI sinks; silence (delta 0) is the AUD-SW FAIL"
      - name: "Assert label matches REAL hardware sink (§11.4.111)"
        action: "Capture dumpsys-audio device labels; host re-verifies against EDID monitor-name / iProduct (no static literal)"
        expected: "Picker label derived from real hardware metadata (not a static string bound to a card index); label↔card drift is the AUD-LBL FAIL"
      - name: "Rapid-switch chaos storm → assert no silence / no crash (§11.4.85)"
        action: "Rapid HDMI-target switch ×20; audioserver crash census"
        expected: "Sound restored after the storm + no audioserver crash; PASS only on captured hw_ptr-delta + no-crash evidence"
    tags: [audio, output-switch, hdmi, jack, usb, bt, "J6", "AUD-LBL", "AUD-SW", "§11.4.69", "§11.4.72", "§11.4.85", "§11.4.111", audio_output]
