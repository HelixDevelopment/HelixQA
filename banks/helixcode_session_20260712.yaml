    - action: send initialize request
    - action: verify response contains protocolVersion + agentCapabilities
    - action: send session/new request
    - action: verify response contains sessionId
  expected: Real handshake + session created
  evidence: captured JSON-RPC request/response

- id: QA-ACP-002
  feature: ACP prompt turn generation
  type: integration
  description: >
    Verify ACP agent streams real LLM generation via session/update
    notifications.
  preconditions: ACP session created, real LLM provider available
  steps:
    - action: send session/prompt with text content
    - action: collect session/update agent_message_chunk notifications
    - action: verify chunks contain real generated text (not simulated)
    - action: verify stopReason is one of end_turn/max_tokens/refusal/cancelled
  expected: Real streamed generation via ACP protocol
  evidence: captured session/update notifications

- id: QA-ACP-003
  feature: ACP permission adapter fail-closed
  type: unit
  description: >
    Verify PermissionAdapter with nil engine defaults to ActionAsk
    (fail-closed, never auto-approve).
  preconditions: none
  steps:
    - action: create PermissionAdapter with nil engine
    - action: call CheckPermission for any tool
    - action: verify returns (false, nil) — must ask user
  expected: Fail-closed behavior
  evidence: test output

- id: QA-ACP-004
  feature: ACP permission request_permission flow
  type: integration
  description: >
    Verify ACP agent calls conn.RequestPermission when engine says ActionAsk,
    presenting allow_once/allow_always/reject_once/reject_always options.
  preconditions: ACP session, permission adapter with engine returning ActionAsk
  steps:
    - action: trigger tool call requiring permission
    - action: verify conn.RequestPermission called with correct options
    - action: verify response maps to execute-or-reject correctly
  expected: Permission requested from client, user choice respected
  evidence: captured ACP request/response

