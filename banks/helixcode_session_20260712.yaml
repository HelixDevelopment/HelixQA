# ─────────────────────────────────────────────────────────────────────
# SECTION 1: RAG Wiring (HXC-118, HXC-148)
# ─────────────────────────────────────────────────────────────────────
- id: QA-RAG-001
  feature: RAG native generate endpoint
  type: integration
  description: >
    Verify POST /api/v1/llm/generate with RAG enabled prepends retrieved
    context to the prompt before sending to the provider.
  preconditions:
    - HelixCode server running with HELIXCODE_RAG_ENABLED=true
    - Real Ollama model available (qwen2:0.5b or similar)
    - RAG vector store has test documents indexed
  steps:
    - action: POST /api/v1/llm/generate
      body: '{"prompt":"What is the test document about?","model":"qwen2:0.5b"}'
      headers: {Content-Type: application/json}
    - action: verify response contains content from indexed test document
    - action: verify response.status == "success"
  expected: Response content references indexed document (RAG augmentation active)
  evidence: captured HTTP response body + server logs showing RAG retrieval

- id: QA-RAG-002
  feature: RAG native stream endpoint
  type: integration
  description: >
    Verify POST /api/v1/llm/stream with RAG enabled prepends retrieved
    context to the prompt in the streaming path.
  preconditions: same as QA-RAG-001
  steps:
    - action: POST /api/v1/llm/stream
      body: '{"prompt":"What is the test document about?","model":"qwen2:0.5b"}'
    - action: collect streamed chunks
    - action: verify streamed content references indexed document
  expected: Streamed content includes RAG-retrieved context
  evidence: captured streamed chunks + server logs

- id: QA-RAG-003
  feature: RAG OpenAI compat endpoint
  type: integration
  description: >
    Verify POST /v1/chat/completions with RAG enabled prepends retrieved
    context (HXC-148).
  preconditions: same as QA-RAG-001
  steps:
    - action: POST /v1/chat/completions
      body: '{"model":"qwen2:0.5b","messages":[{"role":"user","content":"What is the test document about?"}]}'
    - action: verify response.choices[0].message.content references indexed document
  expected: RAG context appears in OpenAI compat response
  evidence: captured response body

- id: QA-RAG-004
  feature: RAG Anthropic compat endpoint
  type: integration
  description: >
    Verify POST /v1/messages with RAG enabled prepends retrieved
    context (HXC-148).
  preconditions: same as QA-RAG-001
  steps:
    - action: POST /v1/messages
      body: '{"model":"qwen2:0.5b","max_tokens":128,"messages":[{"role":"user","content":"What is the test document about?"}]}'
    - action: verify response.content[0].text references indexed document
  expected: RAG context appears in Anthropic compat response
  evidence: captured response body

- id: QA-RAG-005
  feature: RAG disabled by default
  type: integration
  description: >
    Verify that with HELIXCODE_RAG_ENABLED unset, the prompt reaches
    the provider unchanged (byte-identical).
  preconditions: HELIXCODE_RAG_ENABLED unset
  steps:
    - action: POST /api/v1/llm/generate
      body: '{"prompt":"original prompt text","model":"qwen2:0.5b"}'
    - action: verify response does NOT contain RAG-retrieved context
    - action: verify server logs show no RAG retrieval call
  expected: No RAG augmentation when disabled
  evidence: captured response + server logs

- id: QA-RAG-006
  feature: RAG graceful degrade on retrieval error
  type: integration
  description: >
    Verify that when RAG retrieval fails, the request proceeds with
    the original prompt (graceful degrade, not failure).
  preconditions: RAG enabled but retriever returns error
  steps:
    - action: configure retriever to return error
    - action: POST /api/v1/llm/generate
      body: '{"prompt":"test prompt","model":"qwen2:0.5b"}'
    - action: verify response.status == "success"
    - action: verify server logs show retrieval error + graceful degrade
  expected: Request succeeds with original prompt (no RAG context)
  evidence: captured response + server logs

