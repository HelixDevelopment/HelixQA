  # ── RAG Wiring ──────────────────────────────────────────────────────
  - id: QA-RAG-001
    name: "RAG native generate endpoint prepends retrieved context"
    category: integration
    priority: high
    platforms: [linux]
    steps:
      - name: "Start server with RAG enabled"
        action: "Set HELIXCODE_RAG_ENABLED=true, start helixcode server"
        expected: "Server starts healthy on configured port"
      - name: "POST generate with RAG enabled"
        action: "POST /api/v1/llm/generate with prompt about indexed document"
        expected: "Response content references indexed document (RAG active)"
      - name: "Verify server logs show RAG retrieval"
        action: "Check server logs for RAG retrieval call"
        expected: "Logs show retriever called with query"
    tags: [rag, integration, hxc-118]

  - id: QA-RAG-002
    name: "RAG disabled by default leaves prompt unchanged"
    category: integration
    priority: high
    platforms: [linux]
    steps:
      - name: "Start server without RAG enabled"
        action: "Ensure HELIXCODE_RAG_ENABLED is unset"
        expected: "Server starts healthy"
      - name: "POST generate"
        action: "POST /api/v1/llm/generate with test prompt"
        expected: "Response does NOT contain RAG-retrieved context"
    tags: [rag, integration, hxc-118]

  - id: QA-RAG-003
    name: "RAG graceful degrade on retrieval error"
    category: integration
    priority: medium
    platforms: [linux]
    steps:
      - name: "Configure retriever to return error"
        action: "Set up error-returning retriever"
        expected: "Retriever configured"
      - name: "POST generate with RAG enabled"
        action: "POST /api/v1/llm/generate"
        expected: "Request succeeds with original prompt (no RAG context)"
    tags: [rag, integration, hxc-118]

