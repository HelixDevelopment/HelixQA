#
# HelixQA Test Bank: Video Movie & Episode Browsing
# Tests movie and TV episode browsing, search by genre/year/rating, detail
# views, and favorites lifecycle against REAL catalog data discovered from
# real NAS shares. Content includes movies like Interstellar, Inception,
# The Matrix, Chhaava, Companion and TV shows like Breaking Bad.
#
# Anti-bluff per Helix Constitution §11.4 / §11.4.27 / §11.4.69 / §11.4.98:
# every step drives a real /api/v1 endpoint over live HTTP and scores PASS
# only on positive captured evidence.

version: "1.0"
name: "Catalogizer Media Video - Movie & Episode Browsing"
description: "Full-automation API challenge bank proving movie and TV episode
  browse, entity detail resolve, search by title/year, entity types presence,
  media stats, and favorites lifecycle work end-to-end against REAL catalog
  content from real NAS SMB shares. Each challenge drives a REAL
  /api/v1 endpoint over live HTTP and scores PASS only on positive captured
  evidence. Anti-bluff per Helix Constitution 11.4 / 11.4.27 / 11.4.69 /
  11.4.98 / 11.4.135 / 11.4.146: no mocks, no tautologies, no metadata-only
  PASS; an unreachable API or no movie/eps items seeded yields SKIP-with-reason
  (11.4.3), never a fabricated PASS."
metadata:
  author: vasic-digital
  app: Catalogizer
  version: "1.0.0"
  guards_surface: media-video-browse-play
  evidence_root: qa-results/media-video
  endpoints_source: catalog-api/main.go
test_cases:
  - id: VID-API-001
    name: "Browse movie entities returns real movie entries"
    category: functional
    priority: critical
    platforms: [api]
    steps:
      - name: "Browse the movie media type"
        action: "http: GET /api/v1/entities/browse/movie?limit=50"
        expected: "200 OK; body carries items[] array containing at least one movie entity (each with id, title, media_type movie)"
        auth: admin
        expect_status: 200
    tags: [video, movie, browse, resolve, regression-guard, anti-bluff]
    estimated_duration: 6s
    expected_result: "PASS only when response lists >= 1 movie entity; honest SKIP if none seeded"

  - id: VID-API-002
    name: "Browse movies returns items with id and title fields"
    category: functional
    priority: critical
    platforms: [api]
    steps:
      - name: "Browse movies to verify item shape"
        action: "http: GET /api/v1/entities/browse/movie?limit=5"
        expected: "200 OK with items[] array where each item has id (numeric) and title (non-empty string)"
        auth: admin
        expect_status: 200
    tags: [video, movie, detail, shape, regression-guard, anti-bluff]
    estimated_duration: 6s
    expected_result: "PASS only when browse returns items with valid id and title fields"

  - id: VID-API-003
    name: "Browse tv_show entities for TV series content"
    category: functional
    priority: high
    platforms: [api]
    steps:
      - name: "Browse the tv_show media type"
        action: "http: GET /api/v1/entities/browse/tv_show?limit=50"
        expected: "200 OK with items[] array; items have id, title, media_type tv_show if seeded"
        auth: admin
        expect_status: 200
    tags: [video, tv_show, browse, series, anti-bluff]
    estimated_duration: 5s
    expected_result: "PASS only when tv_show browse returns valid response shape"

  - id: VID-API-004
    name: "Resolve Breaking Bad TV show entity by ID"
    category: functional
    priority: high
    platforms: [api]
    steps:
      - name: "Resolve entity id 21 (Breaking Bad)"
        action: "http: GET /api/v1/entities/21"
        expected: "200 OK with tv_show entity whose title contains 'Breaking Bad'"
        auth: admin
        expect_status: 200
    tags: [video, tv_show, breaking-bad, detail, anti-bluff]
    estimated_duration: 4s
    expected_result: "PASS only when entity id 21 resolves as Breaking Bad; SKIP if not in DB (catalogue gap)"

  - id: VID-API-005
    name: "Search movies by title keyword returns matches"
    category: functional
    priority: high
    platforms: [api]
    steps:
      - name: "Search movies by keyword 'The'"
        action: "http: GET /api/v1/entities/search?type=movie&q=The&limit=20"
        expected: "200 OK; items[] movie entities matching 'The' or empty valid array"
        auth: admin
        expect_status: 200
    tags: [video, movie, search, keyword, anti-bluff]
    estimated_duration: 5s
    expected_result: "PASS only when keyword search returns movies with valid shape"

  - id: VID-API-006
    name: "Search movies by year 2024 returns entries from that period"
    category: functional
    priority: medium
    platforms: [api]
    steps:
      - name: "Search for movies from year 2024"
        action: "http: GET /api/v1/entities/search?type=movie&year=2024&limit=20"
        expected: "200 OK; items[] movie entities from 2024 or empty valid array"
        auth: admin
        expect_status: 200
    tags: [video, movie, year, filter, search, anti-bluff]
    estimated_duration: 4s
    expected_result: "PASS only when year-filtered movie search returns valid shape"

  - id: VID-API-007
    name: "Browse media/stats includes movie type counts"
    category: functional
    priority: medium
    platforms: [api]
    steps:
      - name: "Request media stats"
        action: "http: GET /api/v1/media/stats"
        expected: "200 OK with stats object containing media type breakdown"
        auth: admin
        expect_status: 200
    tags: [video, stats, media, type-count, anti-bluff]
    estimated_duration: 4s
    expected_result: "PASS only when /media/stats returns valid stats JSON"

  - id: VID-API-008
    name: "Entity types list includes movie and tv types"
    category: functional
    priority: medium
    platforms: [api]
    steps:
      - name: "List all entity types"
        action: "http: GET /api/v1/entities/types"
        expected: "200 OK with items[] containing movie, tv_show, tv_season, tv_episode among the types"
        auth: admin
        expect_status: 200
    tags: [video, types, entity, registry, anti-bluff]
    estimated_duration: 4s
    expected_result: "PASS only when entity types list includes movie and tv types"

  - id: VID-API-009
    name: "List entities filtered to movie type from generic endpoint"
    category: functional
    priority: medium
    platforms: [api]
    steps:
      - name: "List all entities filtered to movie"
        action: "http: GET /api/v1/entities?type=movie&limit=20"
        expected: "200 OK with items[] array and total field; each item has media_type movie if non-empty"
        auth: admin
        expect_status: 200
    tags: [video, movie, entities, list, anti-bluff]
    estimated_duration: 4s
    expected_result: "PASS only when /entities?type=movie returns valid shape"

  - id: VID-API-010
    name: "Browse movies with limit=5 pagination honoured"
    category: functional
    priority: medium
    platforms: [api]
    steps:
      - name: "Browse movies with limit=5"
        action: "http: GET /api/v1/entities/browse/movie?limit=5&offset=0"
        expected: "200 OK with items[] array length <= 5 and total field"
        auth: admin
        expect_status: 200
    tags: [video, movie, pagination, limit, anti-bluff]
    estimated_duration: 4s
    expected_result: "PASS only when limit=5 is honoured (<= 5 items)"

  - id: VID-API-011
    name: "Search for movie 'Interstellar' by exact title keyword"
    category: functional
    priority: high
    platforms: [api]
    steps:
      - name: "Search movies by keyword 'Interstellar'"
        action: "http: GET /api/v1/entities/search?type=movie&q=Interstellar&limit=10"
        expected: "200 OK; items[] contains movie entity matching 'Interstellar' or empty valid array"
        auth: admin
        expect_status: 200
    tags: [video, movie, search, interstellar, anti-bluff]
    estimated_duration: 4s
    expected_result: "PASS only when the search returns valid response shape"

  - id: VID-API-012
    name: "Browse tv_episode and tv_season entity types"
    category: functional
    priority: medium
    platforms: [api]
    steps:
      - name: "Browse tv_episode type"
        action: "http: GET /api/v1/entities/browse/tv_episode?limit=20"
        expected: "200 OK with items[] array of tv_episode entities or empty valid array"
        auth: admin
        expect_status: 200
      - name: "Browse tv_season type"
        action: "http: GET /api/v1/entities/browse/tv_season?limit=20"
        expected: "200 OK with items[] array of tv_season entities or empty valid array"
        auth: admin
        expect_status: 200
    tags: [video, tv_episode, tv_season, browse, hierarchy, anti-bluff]
    estimated_duration: 6s
    expected_result: "PASS only when both entity types return valid response shape"
