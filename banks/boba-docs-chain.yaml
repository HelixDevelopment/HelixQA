#
# HelixQA Test Bank: Boba Docs Chain and Pre-Build Verification
# Validates the documentation generation pipeline (docs_chain.sh) and
# the pre-build verification gate (pre_build_verification.sh) that
# enforces constitution inheritance, markdown export sync, and
# workable-items validation.

version: "1.0"
name: "Boba Docs Chain and Pre-Build Verification Suite"
description: "End-to-end validation of the documentation generation pipeline: docs_chain.sh --check-only validates without modifying, docs_chain.sh --help displays usage, and pre_build_verification.sh confirms all 18 constitution inheritance invariants pass."
metadata:
  author: "vasic-digital"
  app: "Boba"
  version: "1.0.0"

test_cases:

  - id: BOBA-DOC-001
    name: "docs_chain.sh --check-only validates without modifying"
    category: functional
    priority: critical
    platforms: [cli]
    steps:
      - name: "Run docs_chain.sh --check-only"
        action: >
          bash /Volumes/T7/Projects/Boba/scripts/docs_chain.sh --check-only 2>&1; EC=$?; echo '---'; echo EXIT_CODE=$EC
        expected: "Script runs without errors, exits 0. Output contains check-only markers and step labels (Step 1/3, Step 2/3, Step 3/3)."
      - name: "Verify no files were modified during --check-only"
        action: >
          MRUN=$(date +%s); sleep 1; bash /Volumes/T7/Projects/Boba/scripts/docs_chain.sh --check-only 2>&1 >/dev/null; find /Volumes/T7/Projects/Boba/docs -newermt @$MRUN -name '*.md' -o -name '*.html' -o -name '*.pdf' 2>/dev/null | head -5; echo 'DONE'
        expected: "No files modified (output is 'DONE' or empty, meaning no files were touched during --check-only)"
      - name: "Verify step output mentions workable-items"
        action: >
          bash /Volumes/T7/Projects/Boba/scripts/docs_chain.sh --check-only 2>&1 | grep -q 'workable-items'
        expected: "Output references workable-items validate step"
      - name: "Verify step output mentions markdown export"
        action: >
          bash /Volumes/T7/Projects/Boba/scripts/docs_chain.sh --check-only 2>&1 | grep -qE 'markdown|export|HTML|PDF'
        expected: "Output references markdown export or HTML/PDF generation"
    tags: [boba, docs-chain, check-only, validation]
    estimated_duration: "15s"
    expected_result: "docs_chain.sh --check-only runs all three steps without modifying files, exits 0, and mentions workable-items and markdown export"
    fix_reference:
      bug_id: "BOBA-DOC-CHECKONLY-001"
      description: "docs_chain.sh --check-only must validate all steps without modifying files and exit 0"
      fix_file: "scripts/docs_chain.sh"

  - id: BOBA-DOC-002
    name: "docs_chain.sh --help displays usage"
    category: functional
    priority: medium
    platforms: [cli]
    steps:
      - name: "Run docs_chain.sh --help"
        action: >
          bash /Volumes/T7/Projects/Boba/scripts/docs_chain.sh --help 2>&1; EC=$?; echo '---'; echo EXIT_CODE=$EC
        expected: "Exit code 0. Output contains 'Usage:' and describes --check-only flag."
      - name: "Verify help includes both modes"
        action: >
          bash /Volumes/T7/Projects/Boba/scripts/docs_chain.sh --help 2>&1 | grep -cE 'check-only|Full regeneration'
        expected: "Help text mentions both --check-only and full regeneration modes"
      - name: "Verify -h also works"
        action: >
          bash /Volumes/T7/Projects/Boba/scripts/docs_chain.sh -h 2>&1; EC=$?; echo '---'; echo EXIT_CODE=$EC
        expected: "Exit code 0 with similar help output"
    tags: [boba, docs-chain, help, cli]
    estimated_duration: "5s"
    expected_result: "docs_chain.sh --help and -h both display usage with --check-only and full regeneration mode descriptions, exit 0"
    fix_reference:
      bug_id: "BOBA-DOC-HELP-001"
      description: "docs_chain.sh must support --help/-h flags and display proper usage"
      fix_file: "scripts/docs_chain.sh"

  - id: BOBA-DOC-003
    name: "pre_build_verification.sh all 18 invariants pass"
    category: functional
    priority: critical
    platforms: [cli]
    steps:
      - name: "Run pre_build_verification.sh"
        action: >
          bash /Volumes/T7/Projects/Boba/scripts/pre_build_verification.sh 2>&1; EC=$?; echo '---'; echo EXIT_CODE=$EC
        expected: "All 18 invariants report PASS; exit code 0. Output shows each numbered invariant and its result."
      - name: "Verify invariant count is correct"
        action: >
          bash /Volumes/T7/Projects/Boba/scripts/pre_build_verification.sh 2>&1 | grep -cE '^  PASS \[[0-9]+\]'
        expected: "At least 14 invariants pass (some may be skipped if optional binaries are absent)"
      - name: "Verify constitution inheritance invariants pass"
        action: >
          bash /Volumes/T7/Projects/Boba/scripts/pre_build_verification.sh 2>&1 | grep -E 'constitution.*exists|anchor'
        expected: "Constitution directory and anchor invariants pass (constitution/ exists, Constitution.md contains section 11.4 anchor)"
      - name: "Verify markdown export invariant runs"
        action: >
          bash /Volumes/T7/Projects/Boba/scripts/pre_build_verification.sh 2>&1 | grep -E 'MARKDOWN-EXPORT|markdown export'
        expected: "CM-MARKDOWN-EXPORT-SYNC invariant runs (may pass or warn about missing .docx siblings)"
      - name: "Verify no FAIL lines in output"
        action: >
          bash /Volumes/T7/Projects/Boba/scripts/pre_build_verification.sh 2>&1 | grep -cE '^  FAIL \[' || echo 0
        expected: "Zero FAIL lines -- all invariants pass or are appropriately skipped"
    tags: [boba, pre-build, verification, constitution, gates]
    estimated_duration: "30s"
    expected_result: "pre_build_verification.sh runs all 18 invariants: constitution inheritance, guard hooks, markdown export sync, workable-items validate, docs chain; all pass with zero FAIL lines"
    fix_reference:
      bug_id: "BOBA-DOC-PREBUILD-001"
      description: "pre_build_verification.sh must pass all 18 constitution inheritance invariants before build"
      fix_file: "scripts/pre_build_verification.sh"
