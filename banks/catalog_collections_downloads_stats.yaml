- id: CDS-API-012
  name: Recent media oversized limit is clamped without error (edge case)
  category: functional
  priority: medium
  platforms:
  - api
  steps:
  - name: Request recent media with an out-of-range limit
    action: GET /api/v1/media/recent?limit=99999 with auth token
    expected: 200 OK with items + total — the oversized limit is clamped to the default, no 500
    auth: bearer
  - name: Capture evidence
    action: Driver writes m2_media_recent_clamp.json and asserts status 200 + items + total
    expected: Evidence shows HTTP 200 with a well-formed body despite the oversized limit
  tags:
  - media
