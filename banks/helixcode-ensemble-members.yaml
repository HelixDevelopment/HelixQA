#
# HelixQA Test Bank: HelixCode Helix Agent ensemble member visibility
# ===================================================================
#
# PURPOSE. Validate that the Helix Agent ensemble exposes its MEMBERS to the
# user — the ensemble member COUNT, each member's per-member model annotated with
# the "(via LLMsVerifier)" provenance marker, a per-member "score=", and a
# "[winner]" tag on the selected member — proving members are sourced from the
# verifier (CONST-036/037), NOT a hardcoded list. The proof is a recorded TUI
# session whose status/members panel renders this STRUCTURE, asserted by the
# Panoptic recvalidate frame OCR oracle.
#
# MEMBER-AGNOSTIC (FACT, 2026-06-14). The in-process TUI EnsembleProvider selects
# its members NON-DETERMINISTICALLY from whatever the verifier currently ranks —
# one run surfaces Groq + OpenRouter, another codestral + mistral + deepseek. So
# this bank MUST NOT hardcode specific model NAMES (asserting "deepseek" FAILs a
# perfectly-correct run that surfaced Groq/OpenRouter — a non-determinism bluff).
# Instead it asserts the STRUCTURAL proof that is ALWAYS true regardless of which
# models the verifier picks, exactly the shape applications/terminal_ui.
# FormatEnsemblePanel always renders:
#   "ensemble" + "members" + "(via LLMsVerifier)" + "score=" + a "[winner]" tag.
# This still proves members + their LLMsVerifier-chosen models + per-member scores
# + the selected winner are on screen — it removes ONLY the non-determinism, not
# the anti-bluff bar.
#
# WHY THIS MATTERS (CONST-036/037 + the §11.4 hardcoded-list bluff). A bank that
# PASSes because the ensemble "exists" misses the substance: the user must SEE
# real members with their LLMsVerifier-chosen models, per-member scores, and the
# winner. A recording that renders the ensemble panel WITHOUT "(via LLMsVerifier)"
# or WITHOUT per-member scores/winner is a hardcoded-list / metadata-only bluff ⇒
# FAIL (preserved by the negative case below — a recording with no ensemble panel
# still FAILs).
#
# DECOUPLING (CONST-051(B) / §11.4.28). DATA only. dispatches_to + recvalidate_
# options are consumer data; HelixQA never interprets them. The markers below are
# the member-AGNOSTIC OCR-literal STRUCTURE every real ensemble panel renders.
version: "1.0"
name: "HelixCode Ensemble Member Visibility"
description: >-
  Validates the Helix Agent ensemble's member visibility: a recorded TUI session
  MUST render the MEMBER-AGNOSTIC structural proof — 'ensemble' + 'members' +
  '(via LLMsVerifier)' provenance + per-member 'score=' + a '[winner]' tag — on
  screen (Panoptic recvalidate frame OCR). A green case requires captured
  on-screen evidence of real members + their LLMsVerifier-chosen models + scores
  + winner — NOT specific model names (which the verifier picks
  non-deterministically), and not a hardcoded-list / flag-only PASS
  (CONST-036/037).
metadata:
  author: vasic-digital
  app: HelixCode
  category: "helixcode-ensemble-members"
  priority: critical
  covenant: "CONST-036/037 — members sourced from LLMsVerifier, NOT a hardcoded list; §11.4.69 the rendered panel IS the sink"
  route_source: "helix_code/internal/llm (Helix Agent ensemble) + LLMsVerifier provenance"
  evidence_dir: "qa-results/<run-id>/helixcode-ensemble-members"
  integration_hook: "panoptic-validate-recording <mp4>  (or recording-analyzer --post-analyze --recording <mp4>)"
test_cases:

  - id: HXC-ENS-001
    name: "Server info advertises the Helix Agent ensemble provider"
    category: functional
    priority: high
    platforms: [api]
    steps:
      - name: "GET /api/v1/server/info ensemble"
        action: "http: GET /api/v1/server/info"
        expected: "200 OK; the response references the Helix Agent ensemble provider"
        expect_status: 200
        expect_json_path: "$.info"
        expect_body_contains: "ensemble"
    tags: [ensemble, server-info, features]
    estimated_duration: "5s"
    expected_result: "Server info advertises the Helix Agent ensemble provider"

  # ========================================================================
  # HXC-ENS-002 — recordingqa runtime proof: the ensemble members panel MUST
  # render the MEMBER-AGNOSTIC structure — 'ensemble' + 'members' +
  # '(via LLMsVerifier)' provenance + per-member 'score=' — on screen, regardless
  # of WHICH models the verifier picked this run. Each is a structural marker the
  # Panoptic oracle must match; a missing marker ⇒ FAIL (the panel did not render
  # members + their verifier-chosen models + scores). NO specific model names are
  # asserted — the verifier selects members non-deterministically (one run Groq/
  # OpenRouter, another codestral/mistral/deepseek), so a model-name assertion
  # would FAIL a perfectly-correct run (a non-determinism bluff). The negative
  # case HXC-ENS-003 keeps the anti-bluff bar: a recording with NO ensemble panel
  # still FAILs because none of these structural markers appear.
  # ========================================================================
  - id: HXC-ENS-002
    challenge_id: tui.recording.ensemble-members-and-models-visible
    name: "TUI recording: ensemble member-panel STRUCTURE (members + '(via LLMsVerifier)' + score=) all rendered on screen"
    category: e2e
    priority: critical
    platforms: [tui]
    domains: [tui, recording, ensemble, capability, llmsverifier]
    dispatches_to: >-
      panoptic-validate-recording
      --recording session_members.mp4
      --stderr-log session_members.stderr.log
      --reply-marker "AI:"
      --reply-marker "member:"
      --chrome-pattern "(?i)^\s*\[[^]]+\]\s+(quit|help|scroll|history)"
      --error-scope-replies
      --expect-reply "ensemble"
      --expect-reply "members"
      --expect-reply "via LLMsVerifier"
      --expect-reply "score"
      --error-patterns default
      --findings-out frames_members_findings.jsonl
    metadata:
      recvalidate_options:
        reply_markers:
          - "AI:"
          - "member:"
        chrome_line_patterns:
          - "(?i)^\\s*\\[[^]]+\\]\\s+(quit|help|scroll|history)"
        # error_scope_replies: scope the built-in error/warning scan to the
        # assistant-reply regions so incidental terminal SCROLLBACK that pre-dates
        # the session (startup redis-pool warnings, a stray "Invalid input" JSON
        # payload in the log) cannot false-FAIL a STRUCTURAL-presence bank. Genuine
        # errors inside a model reply still FAIL (§11.4.107(10) — the analyzer must
        # not FAIL real on-screen content, and must not bluff).
        error_scope_replies: true
        # expected_replies / expected_prompts: the MEMBER-AGNOSTIC OCR-literal
        # structure FormatEnsemblePanel always renders — the ensemble header
        # ("ensemble" + "members"), the per-member LLMsVerifier provenance
        # ("via LLMsVerifier"), and a per-member "score". The panel also renders a
        # "[winner]" tag on the selected member (proven structurally by the score=
        # line on the winning member); it is NOT asserted as a separate token here
        # because OCR renders the "[winner]" bracket-tag unreliably through the
        # prompt-reply matcher. These markers DRIVE the real Panoptic run; a
        # recording from a different ensemble surfaces the SAME structural markers.
        expected_replies:
          - "ensemble"
          - "members"
          - "via LLMsVerifier"
          - "score"
        expected_prompts:
          - "ensemble"
          - "members"
          - "via LLMsVerifier"
          - "score"
        expected_model_visible: "ensemble"
        preprocess_vf: "negate"
    required_evidence:
      - "frames_members_findings.jsonl"
      - "session_members.stderr.log"
    steps:
      - name: "Record a TUI session that shows the ensemble members panel"
        action: "Conductor: launch the HelixCode TUI bound to the Helix Agent ensemble, open the members/status panel, wait for the member panel + per-member models + provenance + scores to render, exit; capture mp4 + stderr."
        expected: "session_members.mp4 non-empty; the ensemble member panel renders 'ensemble N/N members', each member's '(via LLMsVerifier)' model + 'score=', and the '[winner]' tag."
      - name: "Panoptic oracle asserts the member-panel STRUCTURE on screen"
        action: "panoptic-validate-recording --recording session_members.mp4 --error-scope-replies --expect-reply ensemble --expect-reply members --expect-reply 'via LLMsVerifier' --expect-reply score"
        expected: "All four structural markers matched in post-marker prose (chrome excluded); no error text inside the model replies; frames_members_findings.jsonl non-empty. A panel missing the provenance marker OR per-member scores ⇒ FAIL (hardcoded-list / incomplete bluff)."
      - name: "Scan the TUI stderr log for error/warning/panic patterns"
        action: "Grep session_members.stderr.log for: panic | fatal | error | 'no provider' | '0 models' | simulated"
        expected: "ZERO matches that indicate a broken ensemble member listing."
      - name: "Assert goal achieved (dispatch exit 0 + evidence ledger satisfied)"
        action: "Dispatcher: wrapper exit 0 AND frames_members_findings.jsonl + session_members.stderr.log both resolve non-empty."
        expected: "PASS — the member panel STRUCTURE (members + LLMsVerifier-chosen models + scores + winner) captured on screen, evidence captured."
    tags: [ensemble, tui, recording, capability, llmsverifier, anti-bluff, "CONST-036", "CONST-037", "§11.4.5", "§11.4.69", "§11.4.107", "§11.4.98", video_display]
    documentation_refs:
      - type: source
        section: "recordingqa orchestrator"
        path: "pkg/recordingqa/recordingqa.go"
      - type: source
        section: "Panoptic recvalidate video oracle adapter"
        path: "pkg/recordingqa/panopticoracle/panopticoracle.go"

  # ========================================================================
  # HXC-ENS-003 — NEGATIVE / golden-bad case (keeps the anti-bluff bar after the
  # member-agnostic relaxation). A recording that does NOT render the ensemble
  # member panel — none of the structural markers ('ensemble' / 'members' /
  # 'via LLMsVerifier' / 'score') on screen — MUST FAIL. This proves the relaxed
  # member-agnostic markers in HXC-ENS-002 are not a tautology that any recording
  # satisfies: the SAME structural assertions, run against a no-ensemble-panel
  # recording, produce a FAIL (missing replies). The consumer supplies a recording
  # that genuinely lacks the panel (e.g. a plain single-provider chat with no
  # ensemble) as session_no_ensemble.mp4; the analyzer's own golden-good/golden-bad
  # self-validation (panoptic internal/recvalidate *_test.go) covers the
  # text-level negation deterministically without a recording.
  # ========================================================================
  - id: HXC-ENS-003
    challenge_id: tui.recording.ensemble-panel-absent-must-fail
    name: "TUI recording NEGATIVE: a session WITHOUT the ensemble member panel MUST FAIL the structural assertions"
    category: e2e
    priority: high
    platforms: [tui]
    domains: [tui, recording, ensemble, anti-bluff, llmsverifier]
    dispatches_to: >-
      panoptic-validate-recording
      --recording session_no_ensemble.mp4
      --reply-marker "AI:"
      --error-scope-replies
      --expect-reply "ensemble"
      --expect-reply "members"
      --expect-reply "via LLMsVerifier"
      --expect-reply "score"
      --expect-fail
      --findings-out frames_no_ensemble_findings.jsonl
    metadata:
      recvalidate_options:
        reply_markers:
          - "AI:"
        error_scope_replies: true
        # SAME member-agnostic structural markers as HXC-ENS-002 — the proof the
        # markers are discriminating: against a recording with NO ensemble panel
        # they are NOT matched, so the oracle FAILs. This is the golden-bad half of
        # the §11.4.107(10) self-validation pair at the bank level.
        expected_replies:
          - "ensemble"
          - "members"
          - "via LLMsVerifier"
          - "score"
        expected_prompts:
          - "ensemble"
          - "members"
          - "via LLMsVerifier"
          - "score"
        preprocess_vf: "negate"
        # expect_fail: the consumer's runner inverts the verdict — a recording
        # without the ensemble panel SHOULD produce a recvalidate FAIL; if it
        # PASSed, the markers are a tautology and THIS case fails.
        expect_fail: true
    required_evidence:
      - "frames_no_ensemble_findings.jsonl"
    steps:
      - name: "Record (or supply) a TUI session that does NOT show the ensemble panel"
        action: "Conductor: record a plain single-provider chat (no ensemble) OR supply a non-ensemble recording as session_no_ensemble.mp4."
        expected: "session_no_ensemble.mp4 non-empty; the ensemble member panel is ABSENT (no 'ensemble N/N members', no '(via LLMsVerifier)', no per-member 'score=')."
      - name: "Panoptic oracle MUST NOT match the ensemble structure"
        action: "panoptic-validate-recording --recording session_no_ensemble.mp4 --expect-reply ensemble --expect-reply members --expect-reply 'via LLMsVerifier' --expect-reply score"
        expected: "recvalidate FAILs (missing structural markers); the runner inverts this to a PASS for the negative case. A recvalidate PASS here would mean the markers are a tautology ⇒ this case FAILs."
