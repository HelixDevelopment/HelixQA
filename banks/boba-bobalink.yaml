  - id: BOBA-LINK-010
    name: "Offline queue persists + dead-letters items when Boba is down, then drains them all when Boba recovers (real OfflineQueue)"
    category: functional
    priority: critical
    platforms: [api]
    steps:
      - name: "Run the offline-queue recovery Challenge against the REAL extension module (driven outside the http: runner)"
        # The http: runner cannot import/exercise the extension's TypeScript
        # modules; the EXTENSION-SIDE offline-queue failure→recover→drain path is
        # driven by the committed Challenge, which drives the REAL OfflineQueue
        # (enqueue/persist/retry/dead-letter/drain) against the SAME in-memory
        # chrome.storage fake the production storage layer uses — a FAILING injected
        # sender (throws), then a WORKING sender (resolves true) — reading the real
        # persisted bytes back from the backing store. This is a documented Challenge
        # step (driven by `helixqa run`/`autonomous` or the one-liner below), never a
        # status-only bluff.
        action: "bash challenges/extension/offline_queue_recovery_challenge.sh"
        expected: "Challenge PASSes: with a FAILING sender (Boba unreachable), 4 enqueued items PERSIST to chrome.storage.local across the failure window and DEAD-LETTER once their attempts reach the retry budget (maxRetries=3) — nothing is silently lost; then, after resetting them for retry, a WORKING sender DRAINS all 4 (every item POSTed) leaving the queue and its persisted state empty. Captured evidence at challenges/extension/.evidence/offline_queue_recovery.json (counts). A queue that silently drops items, never dead-letters, or never drains makes the Challenge FAIL (verified by mutation), so this is never a green-on-broken bluff."
      - name: "The captured evidence file shows persist+dead-letter under failure (none lost) and full drain on recovery"
        # Independent re-assertion of the Challenge's evidence artefact (§11.4.83 /
        # §11.4.69 storage_write): all N items persisted + dead-lettered under the
        # failing sender (none lost), then all N drained under the working sender with
        # the queue + persisted state ending empty.
        action: "python3 -c \"import json;d=json.load(open('challenges/extension/.evidence/offline_queue_recovery.json'));n=d['config']['enqueued'];f=d['failurePhase'];r=d['recoverPhase'];assert d['pass'] and f['persistedAfterFail']==n and f['deadLetteredCount']==n and f['allDeadLettered'] and f['allReachedRetryBudget'] and r['drainedCount']==n and r['succeeded']==n and r['failed']==0 and r['queueSizeAfterDrain']==0 and r['persistedAfterDrain']==0,'evidence mismatch';print('OK')\""
        expected: "Exit 0 / prints OK — the captured evidence shows pass=true, all enqueued items persisted + dead-lettered under the failing sender (none lost, attempts reached the retry budget), and all of them drained under the working sender with the queue and its persisted chrome.storage state ending empty."
    tags: [boba, bobalink, extension, queue, offline, retry, dead-letter, recovery, functional, freeleech-safe, challenge-driven]
    estimated_duration: "20s"
    expected_result: "The BobaLink extension's offline-queue failure→recover→drain path, driven end-to-end through the REAL shipped OfflineQueue (enqueue/persist/retry/dead-letter/drain against the real chrome.storage fake) by challenges/extension/offline_queue_recovery_challenge.sh, persists N items + dead-letters them when Boba is unreachable (nothing lost), then drains all N when Boba recovers (queue + persisted state empty). PASS is backed by captured evidence at challenges/extension/.evidence/offline_queue_recovery.json; a queue that drops items / never dead-letters / never drains makes the Challenge FAIL (verified by mutation). Synthetic infohashes only — no private-tracker payload, no credentials (§11.4.10)."
    fix_reference:
      bug_id: "BOBA-LINK-QUEUE-RECOVERY-001"
      description: "The extension's OfflineQueue must persist failed sends, dead-letter them after the retry budget (nothing lost) while Boba is unreachable, and drain them all on recovery; validated end-to-end against the real extension module by challenges/extension/offline_queue_recovery_challenge.sh"
      fix_file: "extension/src/api/queue.ts"
