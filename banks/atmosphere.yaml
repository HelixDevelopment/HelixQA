        action: "Observe secondary display"
        expected: "Secondary display shows black screen or Presenter background, not a frozen frame"
      - name: "Check VideoPlaybackDetector"
        action: "Run adb logcat -d | grep 'VideoPlaybackDetector.*stop'"
