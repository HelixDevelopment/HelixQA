  # ==================== Dual-Surface BufferQueue Model - Fix #111 (DS-xxx) ====================

  - id: DS-001
    name: "YouTube AD→video transition plays correctly on secondary display"
    category: functional
    priority: critical
    platforms: [android]
    steps:
      - name: "Verify dual surfaces registered"
        action: "adb shell service call video_output 10 — hasSecondaryDisplay must return 1"
        expected: "hasSecondaryDisplay() returns true (both surfaces A and B registered)"
      - name: "Play YouTube video with AD"
        action: "Open YouTube, tap a video that has a pre-roll advertisement"
        expected: "Advertisement begins playing"
      - name: "Verify AD on secondary display"
        action: "Observe TV — AD should appear with correct aspect ratio (no stretching)"
        expected: "AD plays on TV with correct aspect ratio, no deformation"
      - name: "Skip or wait for AD to finish"
        action: "Skip the AD or wait for it to complete"
        expected: "Transition from AD to actual video"
      - name: "Verify actual video on secondary display"
        action: "Observe TV — actual video must appear on secondary display"
        expected: "Video plays on TV with correct aspect ratio, no stale AD frame visible"
      - name: "Verify surface alternation in logcat"
        action: "adb logcat -d | grep VideoOutputManager | grep 'surface'"
        expected: "Logs show surface alternation: first video on surface A, second on surface B (or vice versa)"
    tags: [dual-surface, fix-111, youtube, ad-transition, critical]
    documentation_refs:
      - type: architecture
        section: "Fix #111"
        path: "CLAUDE.md"
    estimated_duration: "60s"
    expected_result: "YouTube AD→video transition works cleanly with dual-surface alternation, no deformation, no stale frame"

