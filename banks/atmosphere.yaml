        path: "device/rockchip/rk3588/tests/test_atm512_dolby_remap_4ch.sh"
      - type: test
        section: "test_spk512_numeric_fold_exec.sh (device-free numeric fold-EXECUTION proof of the SAME out_multi_pcm_remap_5_1_to_4ch() consumer, 6 golden vectors, --selftest golden-good/golden-bad self-validation per §11.4.107(10))"
