        path: "device/rockchip/rk3588/tests/pre_build_verification.sh"
      - type: issue
        section: "docs/Issues.md §GS [ATM-473] — local-playback A/V quality (VLC fork 4K-glitch / perpetual-loading / 5.1→stereo / seek-freeze + MPV 4K glitch); §GS-1 HW-decode DEFERRED pending operator architectural decision, §GS-2/§GS-3/§GS-4 landed source-side REQUIRES_REBUILD"
        path: "docs/Issues.md"
    estimated_duration: "~5s (device-free structural); on-device step PENDING-BUILD (SKIPs hardware_not_present until a vlc-player APK carrying this fix is flashed)"
    expected_result: "The shipped vlc-player fork's VLCOptions.kt keeps HW-decode-with-SW-fallback (--avcodec-hw=any) active, keeps 5.1 PCM auto-layout (--stereo-mode=0) active, keeps the pre-fix hardcoded-SW-only marker (--avcodec-hw=none) absent, and never gains a forced global digital-output passthrough option, confirmed via the device-free source-invariant checker. PASS only on this GREEN structural evidence; a regression on any of the four invariants correctly FAILs this guard. The on-device runtime-signature step honestly SKIPs hardware_not_present/PENDING-BUILD until the vlc-player APK carrying this fix is built and flashed — never a faked PASS."

  - id: ATM-512-DOLBY-5-1-TO-4CH-REMAP
    challenge_id: audio.dolby.5-1-to-4ch-es8388-remap
    name: "Dolby 5.1/7.1 -> 4-channel ES8388 DSP remap — numeric fold correctness device-free proof + on-device ES8388 sink runtime signature (ATM-512/SPK-512 [SPK-07])"
    category: functional
    priority: critical
    platforms: [android]
    dispatches_to: "device/rockchip/rk3588/tests/test_atm512_dolby_remap_4ch.sh"
    feature_class: audio_output
    domains: [audio, dolby, multichannel, es8388, downmix]
    required_evidence: [numeric-fold-execution-golden-vectors, on-device-runtime-signature]
    steps:
      - name: "Device-free numeric fold-EXECUTION proof (§11.4.108 SOURCE layer) — extracts + compiles + RUNS the actual out_multi_pcm_remap_5_1_to_4ch() against 6 golden vectors, self-validated"
        action: "bash device/rockchip/rk3588/tests/test_spk512_numeric_fold_exec.sh --selftest (device-free; the ATM-512 dedicated on-device test itself is #!/system/bin/sh + getprop/setprop/tinyplay/§11.4.111-by-name-ALSA-card and cannot run device-free on a bash host — this sibling harness is the genuine device-free proof of the SAME HAL consumer, out_multi_pcm_remap_5_1_to_4ch(), that the on-device step below observes at the sink; CM-ATM512-4CH-REMAP pre-build gate additionally asserts test_atm512_dolby_remap_4ch.sh exists + is executable + carries its self-detection marker + sources anti_bluff.sh + wires the §11.4.115 ATM512_RED_MODE polarity)"
        expected: "LAYER-A source gate PASSes (out_multi_pcm_remap_5_1_to_4ch() defined, canonical sink channel-order writes present) AND LAYER-B executes the ACTUAL fold against 6 golden vectors (5.1 phantom-center+LFE fold, 7.1 back-surround fold, PENTA 5ch fold, S16 clamp saturation, 5ch non-PENTA dst-overflow-safe pass-through, stereo pass-through) — ALL-GREEN (0 failing vectors) on the GOOD build. The --selftest self-validation additionally injects a golden-BAD sink-order-swap mutation (V1/V2 deliberately mis-ordered) and asserts it is CAUGHT (HAS-FAIL, 2 failing vectors) — proving this harness cannot be an always-pass bluff (§11.4.107(10)). Both polarities confirmed GREEN in this run (device-free, ~1s, PASS=3/FAIL=0/SKIP=0 plain; PASS=4/FAIL=0/SKIP=0 --selftest)."
      - name: "On-device runtime signature (§11.4.108 ARTIFACT+RUNTIME layer) — when a target is reachable AND the vendor build carrying out_multi_pcm_remap_5_1_to_4ch() has been flashed"
        action: "adb_shell: dispatch test_atm512_dolby_remap_4ch.sh (test_all_fixes.sh phase 'ATM-512 Dolby 5.1->4ch HDMI LPCM remap') — resolves the ES8388 4ch-DSP card BY NAME (rockchipes8388/rockchipes8388c, §11.4.111), enables persist.atmosphere.audio.spk512_remap via /vendor/bin/atmosphere-dolby-remap.sh on, plays a real >4ch LPCM reference asset (reference_pcm_5_1_48k.wav) through tinyplay, and captures the ES8388 sink's /proc/asound hw_params channel count + hw_ptr-delta liveness, PLUS an HDMI no-leak cross-check (the fold must stay confined to the ES8388 speaker path per SPK512-SPEAKER-SCOPE, never leak into the HDMI/Arvus AVR multichannel path)"
        expected: "GREEN (ATM512_RED_MODE=0, default): the ES8388 sink clocks out EXACTLY 4 channels with a positive hw_ptr delta (frames genuinely clocked, not a stuck/silent stream) while the HDMI sink (if present) is UNAFFECTED (still reports the raw source channel count) — the runtime signature per the test's own §11.4.108 definition-of-done (a) property applied (b) ES8388 card resolved by name (c) hw_ptr advances + hw_params channels==4 (d) HDMI unchanged. The HAL consumer out_multi_pcm_remap_5_1_to_4ch() is REQUIRES_REBUILD, so this on-device step is honestly PENDING-BUILD until a vendor build carrying it is flashed — SKIPs hardware_not_present when no ES8388 4ch-DSP card or no reference asset is present, SKIPs topology_unsupported when the sink hw_ptr is flat (no sink clocking frames, cannot prove the channel count), and correctly FAILs if the remap toggle does not apply OR the remapped channel count is wrong OR the fold leaks into HDMI — never a faked PASS (§11.4.3/§11.4.69)."
    tags: [audio, dolby, multichannel, es8388, downmix, "ATM-512", "SPK-512", "SPK-07", "§11.4.6", "§11.4.69", "§11.4.107", "§11.4.108", "§11.4.111", "§11.4.115", "§11.4.135", audio_output]
