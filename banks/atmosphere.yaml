  # ==================== Phase-39 §11.4.4(b) layer-4 Challenges (CME-§GR/§HF/§GZ/§11.4.98) ====================
  # Four §11.4.4(b) layer-4 Challenge entries for the just-landed fixes. Each
  # dispatches to the fix's REAL on-device test, is §11.4.3 topology-aware
  # (SKIP-with-reason when the required topology/weak-link is absent, NEVER
  # PASS-by-default), and scores PASS ONLY on the test's ab_pass_with_evidence
  # captured artefact per §11.4.5 + §11.4.69 — never metadata-only/config-only.

  - id: CME-GR-STREAM-CONTINUITY-001
    name: "§GR (#41) sustained network stream survives a >3s mid-rebuffer with secondary-display routing intact (no forceUnregister full-teardown)"
    suite: atmosphere.video
    category: video
    priority: critical
    description: |
      §GR (#41 — "video stream stops after 1-2 min, does not continue")
      Challenge. Dispatches to device/rockchip/rk3588/tests/test_gr_stream_continuity.sh,
      the §11.4.43 RED-first on-device test for the proven Rank-1 first-party
      mechanism (Presenter VideoPlaybackDetector treating media3
      STATE_BUFFERING as "not playing" → a mid-stream rebuffer >3000 ms
      STOP_DEBOUNCE fires onVideoPlaybackStopped() →
      VideoOutputClient.forceUnregister() →
      VideoOutputManagerService.forceUnregisterActiveDecoder() whose
      setOutputSurface(PRIMARY) FAILs BAD_INDEX on RK3588 Codec2, nulling
      mActiveDecoder + tearing down the secondary surface → video dead-on-TV).
      The test drives a sustained network stream to the secondary (EXTERNAL)
      display, captures the §GR forensic logcat over a >=60s window, and
      asserts (Section C) that NO BUFFERING event drove a "forceUnregister
      ActiveDecoder: clearing" full-teardown AND (Section D) the active
      decoder package on the secondary display is unchanged across the
      rebuffer window. PASS is scored ONLY on the test's ab_pass_with_evidence
      with the captured forensic logcat as the evidence artefact (feature
      class video_display); the §GR defect chain in the logcat is ab_fail.
      §11.4.3 topology dispatch: no secondary display OR no mid-stream
      rebuffer in-window (pristine link, the D3 case) → ab_skip_with_reason,
      NEVER a fake PASS. The fix is REQUIRES_REBUILD; this Challenge is RED
      on a weak-link secondary-display device until the rebuild lands Fix 1
      (VPD treats STATE_BUFFERING as still-playing) + Fix 2 (recoverable
      forceUnregister keep-alive while the decoder process is still running).
