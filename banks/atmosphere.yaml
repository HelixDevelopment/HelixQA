  - id: ATM-473-VLC-AVQ-SOURCE-INVARIANTS
    challenge_id: video.vlc.local-avq-source-invariants
    name: "VLC-fork local A/V-quality fix invariants stay in place — HW-decode-with-SW-fallback enabled + 5.1 PCM auto-layout active, no forced global digital-output passthrough (ATM-473/§GS)"
    category: functional
