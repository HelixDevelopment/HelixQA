test_cases:
  # ==================== Video Routing to Secondary Display (VR-xxx) ====================

  - id: VR-001
    name: "Video plays on secondary display when started from VLC"
    category: functional
    priority: critical
    platforms: [android]
    steps:
      - name: "Verify secondary display connected"
        action: "Check that HDMI-A-1 (TV) is connected via dumpsys display"
        expected: "Secondary display detected with valid display ID"
      - name: "Launch VLC and play video"
        action: "Open VLC, select a local video file, start playback"
        expected: "VLC begins playback"
      - name: "Verify video on secondary display"
        action: "Observe the TV (HDMI-A-1 secondary display)"
        expected: "Video content appears on the TV via Presentation API"
      - name: "Verify primary shows overlay"
        action: "Check the primary display (touch screen)"
        expected: "VideoControlOverlay visible on primary display with playback controls"
    tags: [video-routing, vlc, secondary-display, tier1]
    documentation_refs:
      - type: architecture
        section: "Fix #107"
        path: "docs/guides/SYSTEM_ARCHITECTURE.md"
    estimated_duration: "30s"
    expected_result: "VLC video redirected to secondary display via MediaCodec SW codec hook"

  - id: VR-002
    name: "Video plays on secondary display when started from YouTube"
    category: functional
    priority: critical
    platforms: [android]
    steps:
      - name: "Verify secondary display connected"
        action: "Check that HDMI-A-1 (TV) is connected"
        expected: "Secondary display present"
      - name: "Launch YouTube and play video"
        action: "Open YouTube app, search for any video, start playback"
        expected: "YouTube begins video playback"
      - name: "Verify video on secondary display"
        action: "Observe the TV"
        expected: "Video content renders on secondary display"
      - name: "Verify ExoPlayer SW fallback"
        action: "Check logcat for MediaCodec configure hook intercepting ExoPlayer"
        expected: "Log shows HW codec rejected, ExoPlayer retries with SW codec (c2.android.*)"
    tags: [video-routing, youtube, exoplayer, secondary-display, tier1]
    documentation_refs:
      - type: architecture
        section: "Fix #107"
        path: "docs/guides/SYSTEM_ARCHITECTURE.md"
    estimated_duration: "45s"
    expected_result: "YouTube ExoPlayer video redirected to secondary display via SW codec"

  - id: VR-003
    name: "Video plays on secondary display when started from Kodi"
    category: functional
    priority: critical
    platforms: [android]
    steps:
      - name: "Verify secondary display connected"
        action: "Check that HDMI-A-1 (TV) is connected"
        expected: "Secondary display present"
      - name: "Launch Kodi and play video"
        action: "Open Kodi, navigate to a local video file, start playback"
        expected: "Kodi begins video playback via its internal FFmpeg decoder"
      - name: "Verify video on secondary display"
        action: "Observe the TV"
        expected: "Video content appears on secondary display"
    tags: [video-routing, kodi, ffmpeg, secondary-display]
    documentation_refs:
      - type: architecture
        section: "Fix #102"
        path: "docs/guides/SYSTEM_ARCHITECTURE.md"
    estimated_duration: "45s"
    expected_result: "Kodi video routed to secondary display"

  - id: VR-004
    name: "MediaCodec hook intercepts ExoPlayer configure()"
    category: integration
    priority: critical
    platforms: [android]
    steps:
      - name: "Clear logcat buffer"
        action: "Run adb logcat -c"
        expected: "Logcat buffer cleared"
      - name: "Start ExoPlayer-based video"
        action: "Launch any ExoPlayer-based app (YouTube, Jellyfin) and play a video"
        expected: "Video playback starts"
      - name: "Check logcat for hook"
        action: "Run adb logcat -d | grep 'MediaCodec.*configure.*secondary'"
        expected: "Log entry showing MediaCodec.configure() intercepted and surface redirected"
      - name: "Verify stack trace detection"
        action: "Check logcat for ExoPlayer stack trace identification"
        expected: "Log confirms ExoPlayer detected in call stack"
    tags: [video-routing, mediacodec, hook, exoplayer]
    documentation_refs:
      - type: architecture
        section: "Fix #88"
        path: "docs/guides/SYSTEM_ARCHITECTURE.md"
    estimated_duration: "30s"
    expected_result: "MediaCodec.configure() hook successfully intercepts and redirects ExoPlayer video decoder"

  - id: VR-005
    name: "SW codec (c2.android.*) used instead of HW codec for secondary display"
    category: functional
    priority: critical
    platforms: [android]
    steps:
      - name: "Clear logcat"
        action: "Run adb logcat -c"
        expected: "Buffer cleared"
      - name: "Play video on ExoPlayer-based app"
        action: "Start video playback in YouTube or similar"
        expected: "Video plays on secondary display"
      - name: "Verify SW codec in use"
        action: "Run adb logcat -d | grep 'c2.android'"
        expected: "SW codec instance (c2.android.avc.decoder or c2.android.hevc.decoder) active"
      - name: "Verify no HW codec"
        action: "Run adb logcat -d | grep 'c2.rk.*started'"
        expected: "No HW codec (c2.rk.*) started for this video"
    tags: [video-routing, sw-codec, hw-codec, secondary-display]
    documentation_refs:
      - type: architecture
        section: "Fix #107"
        path: "docs/guides/SYSTEM_ARCHITECTURE.md"
    estimated_duration: "30s"
    expected_result: "SW codec used for secondary display rendering, HW codec avoided due to BAD_INDEX crash"

  - id: VR-006
    name: "HW codec rejected triggers ExoPlayer SW fallback"
    category: integration
    priority: critical
    platforms: [android]
    steps:
      - name: "Clear logcat"
        action: "Run adb logcat -c"
        expected: "Buffer cleared"
      - name: "Start ExoPlayer video"
        action: "Play video in an ExoPlayer-based app with secondary display connected"
        expected: "Video begins playback"
      - name: "Check for IllegalArgumentException in logcat"
        action: "Run adb logcat -d | grep -E 'IllegalArgument|ExoPlayer.*fallback'"
        expected: "Log shows IllegalArgumentException thrown for HW codec, ExoPlayer retries with SW codec"
      - name: "Verify video plays correctly"
        action: "Observe video on secondary display"
        expected: "Video renders without artifacts on secondary display via SW codec"
    tags: [video-routing, exoplayer, fallback, hw-codec-rejection]
    documentation_refs:
      - type: architecture
        section: "Fix #101"
        path: "docs/guides/SYSTEM_ARCHITECTURE.md"
    estimated_duration: "30s"
    expected_result: "ExoPlayer receives IllegalArgumentException for HW codec configure and transparently falls back to SW codec"

  - id: VR-007
    name: "Video stops on secondary when app navigates away"
    category: functional
    priority: high
    platforms: [android]
    steps:
      - name: "Start video on secondary"
        action: "Play video in any app; verify it appears on secondary display"
