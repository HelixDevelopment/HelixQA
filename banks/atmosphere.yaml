    platforms: [android]
    dispatches_to: "device/rockchip/rk3588/tests/test_atm473_vlc_avq_source_invariants.sh"
    feature_class: mediacodec_decode
    domains: [video, audio, local-playback, vlc, hw-decode, multichannel]
    required_evidence: [vlcoptions-source-invariant-census, on-device-runtime-signature]
    steps:
      - name: "GREEN regression guard — --avcodec-hw=any HW-decode-with-SW-fallback active, --stereo-mode=0 5.1 auto-layout active, no forced global digital-output passthrough, pre-fix --avcodec-hw=none absent"
        action: "bash device/rockchip/rk3588/tests/test_atm473_vlc_avq_source_invariants.sh (device-free, default RED_MODE=0 GREEN-guard invocation against the vlc-player fork's VLCOptions.kt)"
        expected: "Four invariants all hold and the checker exits 0 (GREEN): (1) the pre-fix defect marker active options.add(\"--avcodec-hw=none\") — the hardcoded SW-only 4K decode that was the §GS-1 root cause — is ABSENT; (2) active options.add(\"--avcodec-hw=any\") is PRESENT (HW decode enabled with automatic SW fallback, the §GS-1b fix); (3) active options.add(\"--stereo-mode=0\") is PRESENT (5.1/7.1 PCM auto-layout reaching the HDMI/Arvus multichannel sink instead of a stereo downmix, the §GS-2 fix); (4) SAFETY invariant — no active forced digital-output/spdif passthrough option was added (which would silence the ES8388/USB/BT analog sinks, the exact fix-A-break-B hazard §11.4.1 forbids). If any invariant regresses, the checker correctly FAILs — no bluff-tolerant default. This checker has NO --selftest fixture (confirmed by source read — unlike the ATM-282/ATM-256 sibling checkers), so no discrimination-proof step is claimed here (§11.4.6 — omitted rather than fabricated)."
      - name: "On-device runtime signature (§11.4.108 ARTIFACT+RUNTIME layer) — when a target is reachable AND the vlc-player APK carrying this fix has been built and flashed"
        action: "adb_shell: pm path atmosphere.videolan.vlc && play a local 5.1 4K clip from /sdcard/Movies via the VLC-fork UI, then assert /proc/asound/card*/pcm*p/sub0/hw_params channels>=6 during playback (§GS-2 5.1-not-stereo runtime signature) AND sample decoder CPU/frame-advance liveness per §11.4.107 over the 4K clip (§GS-1b HW-decode-with-fallback runtime signature)"
        expected: "This ATM-473/§GS batch is REQUIRES_REBUILD and, per docs/Issues.md §GS + the RED test's own PENDING-BUILD note, its on-device 5.1/4K E2E validation is explicitly PENDING — no dedicated on-device dispatch script exists yet for this runtime signature (unlike ATM-282/ATM-256, whose sibling on-device scripts already exist). No device reachable, OR a device is reachable but is not yet running a vlc-player build carrying this fix, => honest SKIP hardware_not_present (§11.4.3/§11.4.69) — never a faked PASS. The device-free GREEN-guard step above already proves the ATM-473 source-consistency finding independent of this step; the PENDING-BUILD state is tracked at docs/Issues.md §GS-1 (HW-decode, DEFERRED pending operator architectural decision) / §GS-3 / §GS-4 (on-device validation pending)."
    tags: [video, audio, local_playback, vlc, hw_decode, multichannel, "ATM-473", "§GS", "§11.4.1", "§11.4.6", "§11.4.108", "§11.4.115", "§11.4.135", "§11.4.69", mediacodec_decode, audio_output]
