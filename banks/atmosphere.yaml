  - id: CME-VIDEO-COLOR-FIDELITY-001
    name: "§11.4.98 (#48) source-vs-rendered video color fidelity within tolerance (ΔE2000 + histogram + no-pale + sharpness + aspect + continuity), golden/bad self-validation proven"
    suite: atmosphere.video
    category: video
    priority: critical
    description: |
      §11.4.98 (#48) video color/visual-quality fidelity Challenge. Dispatches
      to device/rockchip/rk3588/tests/test_video_color_fidelity.sh, the
      autonomous, re-runnable, anti-bluff test that proves WITH REAL CAPTURED
      PIXELS that video frames rendered on the device are COLOR-FAITHFUL to
      the source. The ground-truth discriminator: for each player + clip the
      SOURCE reference frame is extracted ON THE HOST with ffmpeg at the same
      scene timestamp the device seeks to, the device-RENDERED frame is
      captured via screencap, and scripts/testing/video_color_analyze.py
      compares the pair across ΔE2000, HSV histogram correlation, saturation
      (no-pale / no-oversaturation — catches the BT.601/709/2020
      full-vs-limited-range washed-out failure), sharpness (Laplacian
      variance), aspect ratio, and SSIM continuity/no-freeze + OCR obstruction
      census. Before any device capture the test runs the §11.4.100 /
      §11.4.43 HARNESS SELF-VALIDATION: a known-good GOLDEN pair MUST PASS and
      a deliberately-DESATURATED known-bad pair MUST FAIL on no_pale — a
      golden→FAIL (false negative) or bad→PASS (false positive, the worst
      defect) FAILs the whole test before any device verdict is fabricated.
      PASS is scored ONLY on the test's ab_pass_with_evidence with the
      per-clip verdict.json + source-vs-rendered frame artefacts (feature
      class video_display) — never metadata-only. §11.4.3 topology + capture
      honesty: FLAG_SECURE secondary HDMI (D1/D3) → 0-byte screencap →
      ab_skip_with_reason=topology_unsupported; DRM-protected apps
      (Netflix/Disney+) → black framebuffer → ab_skip_with_reason=
      operator_attended (needs an HDMI capture card); geo-restricted streams
      → ab_skip_with_reason=geo_restricted — NEVER a faked PASS, NEVER a
      FAIL-for-topology. §11.4.50 N=3; §11.4.98 zero manual intervention.
    setup:
      - "Push tests/ to /data/local/tmp; host has ffmpeg + python3 + opencv/numpy for video_color_analyze.py"
      - "Verify the device is reachable via ADB and a non-DRM player can render the bundled test clip on the primary display"
    steps:
      - name: "Dispatch §11.4.98 color-fidelity proof (harness self-validation + device capture)"
        action: "shell: bash device/rockchip/rk3588/tests/test_video_color_fidelity.sh"
        expected: "Exit 0; SUMMARY FAIL=0; harness self-validation GOLDEN→PASS + BAD→FAIL-on-no_pale, then each player+clip row ab_pass_with_evidence cites verdict.json"
      - name: "Verify golden/bad self-validation (anti-bluff harness proof, §11.4.1)"
        action: "Inspect selfval-golden + selfval-bad artefacts: the faithful golden pair is certified faithful (PASS) and the desaturated bad pair is rejected specifically on no_pale (FAIL)"
        expected: "The comparison harness is proven free of false negatives (golden) AND false positives (bad) BEFORE any device verdict — the §11.4.43 RED(bad)→GREEN(golden) embodiment"
      - name: "Verify source-vs-rendered fidelity evidence (§11.4.69)"
        action: "Inspect a passing row's verdict.json + frame pair: ΔE2000, histogram correlation, no_pale/no_oversaturation, sharpness, aspect ratio, and continuity SSIM are all within tolerance vs the host-extracted source frame"
        expected: "Positive captured evidence (video_display): rendered pixels match the source within tolerance; NO PASS without the verdict.json + source-vs-rendered frame artefact path"
      - name: "Verify capture-honesty SKIPs (§11.4.3 / §11.4.6)"
        action: "Confirm FLAG_SECURE secondary HDMI → topology_unsupported SKIP, DRM apps → operator_attended SKIP, geo-restricted streams → geo_restricted SKIP"
        expected: "SKIP-with-reason for unreachable capture paths (never PASS-by-default, never FAIL-for-topology/DRM/geo)"
      - name: "Verify device left quiescent (§11.4.14)"
        action: "After the run, confirm the player app is force-stopped and no media session is PLAYING for the test app"
        expected: "EXIT trap force-stopped the player; device quiescent"
    tags: [video, color-fidelity, delta-e2000, histogram, no-pale, sharpness, aspect-ratio, continuity, ssim, golden-bad-self-validation, §11.4.98, ATM-48, §11.4.3, §11.4.5, §11.4.50, §11.4.69, §11.4.100, phase-39, video_display]
