  - id: CME-AF-RECENTS-CLEAR-ALL-001
    name: "§AF/§GZ Presenter Clear-All Recents FAB is user-visible on display#0 and a REAL tap clears all recents (no backend-broadcast bluff)"
    suite: atmosphere.input
    category: functional
    priority: critical
    description: |
      §AF/§GZ [Clear-All Recents] Challenge. Dispatches to
      device/rockchip/rk3588/tests/test_recents_clear_all.sh, the §11.4.43
      RED-first test for the user-visible Clear-All affordance: a
      Presenter-owned TYPE_APPLICATION_OVERLAY 56dp FAB
      (RecentsClearAllOverlay.kt) anchored bottom-right of display#0 (the
      primary touch screen) with contentDescription "ATMOSphere Clear All
      Recents", shown ONLY while the Lawnchair launcher (app.lawnchair.play
      / app.lawnchair) is foreground (i.e. while the user is on the Recents
      / overview surface). On a USER TAP it fires
      Intent("com.atmosphere.action.CLEAR_RECENTS") which
      RecentsHelper.clearAllRecents() consumes (reflective
      removeAllVisibleRecentTasks). This Challenge REPLACES the prior
      backend-only bluff (which fired the broadcast directly via
      `am broadcast` and PASSed on the backend alone — never proving the
      FAB exists, is visible, or that a real tap on it clears recents). Per
      §11.4.48 the Clear-All is exercised by a REAL `input tap` at the FAB's
      resolved uiautomator bounds (NOT a broadcast shortcut) and the
      single-card dismiss by a REAL `input swipe` UP (NOT
      `am stack remove-task`). PASS is scored ONLY on the test's
      ab_pass_with_evidence captured artefacts (feature class touch_input):
      dumpsys overview snapshot (C1), uiautomator ui.xml + screencap png
      proving the content-desc FAB node with non-zero bounds (C2),
      before/after recents dump proving AFTER==0 + launched apps absent
      (C3), and a before/after dump proving exactly ONE card removed (C4) —
      never metadata-only/backend-only. §11.4.3 topology: Recents/overview
      and the FAB live on display#0 regardless of secondary-display
      presence, so the assertion is topology-independent (A2 annotates which
      topology was seen); when Recents cannot be populated to >=3 tasks the
      test honestly ab_skip_with_reason=topology_unsupported, NEVER a fake
      PASS. §11.4.50 N=3 determinism on the OPEN->VISIBLE chain (Section D).
      The fix is REQUIRES_REBUILD — the FAB lives in the platform-signed
      Presenter APK not yet in the flashed firmware; this Challenge is RED on
      current firmware (Section C2 FAILs honestly: the content-desc node is
      absent so C3/C4 also FAIL — no FAB to tap) and PASSes only once the
      §AF+§GZ build + flash makes the user-visible button genuinely work.
    setup:
