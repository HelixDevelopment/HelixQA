  # ==================== Frozen Frame Detection & Cleanup (FF-xxx) ====================

  - id: FF-001
    name: "Frozen frame auto-detected via C2BqBuffer stall"
    category: functional
    priority: critical
    platforms: [android]
    steps:
      - name: "Play video on secondary display"
        action: "Start video in any app, wait for it to play on secondary"
        expected: "Video playing on secondary display"
      - name: "Trigger stall condition"
        action: "Force-stop the video app while video is playing (adb shell am force-stop)"
        expected: "Video stops but frame may remain on secondary display"
      - name: "Wait for detection"
