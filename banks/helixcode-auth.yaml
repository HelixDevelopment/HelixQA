version: "1.0"
name: "HelixCode Auth & Access Control"
description: >-
  Self-driving (§11.4.98) HelixQA bank exercising HelixCode's authentication
  endpoints and the authMiddleware access-control boundary. Every step is a real
  http: request with machine-checkable status / body-substring assertions; no
  manual review, no human action after startup, self-cleaning (negative paths
  and unauthenticated probes only — no user is created or mutated). Routes and
  exact reject messages verified against helix_code/internal/server/server.go
  (authMiddleware) and handlers.go (login/logout/refresh).
metadata:
  author: vasic-digital
  app: HelixCode
  target_server: "HelixCode HTTP server (cmd/server) — real PostgreSQL + Redis backed"
  covenant: "§11.4.98 full-automation anti-bluff"
  route_source: "helix_code/internal/server/server.go authMiddleware + handlers.go login/logout/refresh"
test_cases:
  - id: HXC-AUTH-001
    name: "Login with empty body fails request-body validation (400)"
    category: negative
    priority: high
    platforms: [api]
    steps:
      - name: "POST /api/v1/auth/login empty body"
        action: "http: POST /api/v1/auth/login"
        expected: "400 Bad Request — username/password required"
        body: {}
        expect_status: 400
        expect_body_contains: "required"
    tags: [auth, login, negative, validation]
    estimated_duration: "5s"
    expected_result: "Empty login body fails binding validation with 400 (required fields)"

  - id: HXC-AUTH-002
    name: "Login with missing password fails validation (400)"
    category: negative
    priority: medium
    platforms: [api]
    steps:
      - name: "POST /api/v1/auth/login no password"
        action: "http: POST /api/v1/auth/login"
        expected: "400 Bad Request — password required"
        body:
          username: "someuser_hxc_auth"
        expect_status: 400
        expect_body_contains: "required"
    tags: [auth, login, negative, validation]
    estimated_duration: "5s"
    expected_result: "Login with only a username is rejected with 400 (password required)"

  - id: HXC-AUTH-003
    name: "Login with invalid credentials is rejected (401)"
    category: negative
    priority: critical
    platforms: [api]
    steps:
      - name: "POST /api/v1/auth/login wrong creds"
        action: "http: POST /api/v1/auth/login"
        expected: "401 Unauthorized — Login failed"
        body:
          username: "definitely_not_a_user_hxc_auth"
          password: "wrong_password_value"
        expect_status: 401
        expect_body_contains: "Login failed"
    tags: [auth, login, negative]
    estimated_duration: "5s"
    expected_result: "Invalid credentials are rejected with 401, never a fabricated session"

  - id: HXC-AUTH-004
    name: "Logout without Authorization header is rejected (400)"
    category: negative
    priority: medium
    platforms: [api]
    steps:
      - name: "POST /api/v1/auth/logout no header"
        action: "http: POST /api/v1/auth/logout"
        expected: "400 Bad Request — missing authorization header"
        expect_status: 400
    tags: [auth, logout, negative]
    estimated_duration: "5s"
    expected_result: "Logout without a bearer token is rejected with 400"

  - id: HXC-AUTH-005
    name: "Token refresh without Authorization header is rejected (401)"
    category: negative
    priority: medium
    platforms: [api]
    steps:
      - name: "POST /api/v1/auth/refresh no header"
        action: "http: POST /api/v1/auth/refresh"
        expected: "401 Unauthorized — authorization header required"
        expect_status: 401
    tags: [auth, refresh, negative]
    estimated_duration: "5s"
    expected_result: "Refresh without a bearer token is rejected with 401"

  - id: HXC-AUTH-006
    name: "Protected /api/v1/tasks requires auth (401 + exact message)"
    category: security
    priority: critical
    platforms: [api]
    steps:
      - name: "GET /api/v1/tasks without auth"
        action: "http: GET /api/v1/tasks"
        expected: "401 Unauthorized — Authorization header required"
        expect_status: 401
        expect_body_contains: "Authorization header required"
    tags: [auth, security, protected]
    estimated_duration: "5s"
    expected_result: "Unauthenticated access to /api/v1/tasks is rejected with 401 and the exact reject message"

