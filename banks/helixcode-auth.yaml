  - id: HXC-AUTH-014
    name: "Malformed (non-Bearer) Authorization header is rejected (401)"
    category: security
    priority: high
    platforms: [api]
    steps:
      - name: "GET /api/v1/tasks with non-Bearer header"
        action: "http: GET /api/v1/tasks"
        expected: "401 Unauthorized — invalid authorization header format"
        headers:
          Authorization: "Basic dXNlcjpwYXNz"
        expect_status: 401
        expect_body_contains: "Invalid authorization header format"
    tags: [auth, security, jwt, negative]
    estimated_duration: "5s"
    expected_result: "A non-Bearer Authorization header is rejected with 401 invalid format"

  - id: HXC-AUTH-015
    name: "Garbage bearer token is rejected as invalid/expired (401)"
    category: security
    priority: high
    platforms: [api]
    steps:
      - name: "GET /api/v1/tasks with garbage bearer token"
        action: "http: GET /api/v1/tasks"
        expected: "401 Unauthorized — invalid or expired token"
        auth: "raw:not-a-real-jwt-token-hxc-auth"
        expect_status: 401
        expect_body_contains: "Invalid or expired token"
    tags: [auth, security, jwt, negative]
    estimated_duration: "5s"
    expected_result: "A malformed bearer token yields 401 invalid/expired token, not access"

  - id: HXC-AUTH-016
