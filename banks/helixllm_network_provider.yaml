  # ==========================================================================
  # NETPROV-NOT-LOOPBACK-GOLDEN-BAD-001 — RED-first proof (§11.4.115) that
  # the LAN-not-loopback discriminator is load-bearing, not decorative.
  # Same live coder, same correct prompt/answer, but the endpoint is
  # localhost:18434 — a naive "the coder answers correctly" test would
  # PASS here; this bank's LAN check correctly FAILs it at the raw level.
  # ==========================================================================
  - id: NETPROV-NOT-LOOPBACK-GOLDEN-BAD-001
    challenge_id: helixagent.network_provider.loopback-endpoint-must-fail-lan-check
    name: "Golden-bad: correct answer over LOOPBACK must FAIL the LAN check (raw), case succeeds via --expect-fail"
    category: functional
    priority: critical
    platforms: [api]
    domains: [network-provider, llm, lan, anti-bluff]
    dispatches_to: >-
      bin/helixqa-verify-netprov
      --endpoint http://localhost:18434/v1/chat/completions
      --model /models/Qwen3-Coder-30B-A3B-Instruct-Q4_K_M.gguf
      --prompt "reply with only the word OK"
      --expect "ok"
      --require-lan
      --expect-fail
      --out qa-results/helixllm_network_provider/not_loopback_golden_bad_001_verdict.json
      --conduit-dir qa-results/helixllm_network_provider/conduit
      --challenge-id NETPROV-NOT-LOOPBACK-GOLDEN-BAD-001
    metadata:
      expect_fail: true
      red_first_proof: >-
        Authored 2026-07-08: the live coder DOES answer "OK" correctly
        over localhost:18434 (matched_facts=1/1) — but is_loopback=true and
        require_lan=true force lan_check_pass=false, so raw pass=false and
        case_result=true (via --expect-fail inversion). This is the
        RED-first evidence (§11.4.115) that a naive fact-only test would
        wrongly PASS on loopback alone; this bank's discriminator does not.
    required_evidence:
      - "qa-results/helixllm_network_provider/not_loopback_golden_bad_001_verdict.json | json:case_result==true | json:pass==false | json:is_loopback==true | json:lan_check_pass==false | json:matched_facts==1"
    steps:
      - name: "Golden-bad: analyzer must reject a loopback endpoint (raw FAIL) even with a factually-correct response; case succeeds via --expect-fail inversion"
        action: "http: POST /v1/chat/completions"
        body:
          model: "local"
          messages:
            - role: "user"
              content: "HXC-243 endpoint-contract probe: reply with the single word PONG"
          max_tokens: 8
          temperature: 0
        # HXC-243: an explicit expectation is what makes this step falsifiable.
        # 200 alone is NOT enough — a wrong service can answer 200 with an error
        # envelope, so the json_path additionally demands a REAL completion body.
        expect_status: 200
        expect_json_path: "$.choices[0].message.content"
        expected: >-
          pass==false because is_loopback==true (despite matched_facts==1);
          case_result==true because this case declares --expect-fail. A
          case_result==false here would mean the analyzer bluff-PASSed a
          loopback-served answer as if it proved the LAN path.

  # ==========================================================================
  # NETPROV-UNREACHABLE-GOLDEN-BAD-001 — honest infra-error path
  # (§11.4.3 / §11.4.6): a deliberately wrong port proves this analyzer
  # never fakes a PASS on a connection failure.
  # ==========================================================================
  - id: NETPROV-UNREACHABLE-GOLDEN-BAD-001
    challenge_id: helixagent.network_provider.unreachable-endpoint-honest-infra-fail
    name: "Golden-bad: unreachable LAN port honestly infra-fails (raw), case succeeds via --expect-fail"
    category: functional
    priority: high
    platforms: [api]
    domains: [network-provider, llm, lan, anti-bluff]
    dispatches_to: >-
      bin/helixqa-verify-netprov
      --endpoint http://10.6.100.221:19999/v1/chat/completions
      --model /models/Qwen3-Coder-30B-A3B-Instruct-Q4_K_M.gguf
      --prompt "reply with only the word OK"
      --expect "ok"
      --require-lan
      --expect-fail
      --timeout 5s
      --out qa-results/helixllm_network_provider/unreachable_golden_bad_001_verdict.json
      --conduit-dir qa-results/helixllm_network_provider/conduit
      --challenge-id NETPROV-UNREACHABLE-GOLDEN-BAD-001
    metadata:
      expect_fail: true
      red_first_proof: >-
        Authored 2026-07-08: port 19999 on 10.6.100.221 has no listener
        ("connection refused"), captured honestly as a non-empty "error"
        field and pass=false; case_result=true via --expect-fail inversion.
        Proves the analyzer never fakes a PASS when the LAN endpoint is
        genuinely unreachable (§11.4.6).
    required_evidence:
      - "qa-results/helixllm_network_provider/unreachable_golden_bad_001_verdict.json | json:case_result==true | json:pass==false | json:http_status==0"
    steps:
      - name: "Golden-bad: analyzer must honestly infra-fail (raw FAIL, non-empty error) on an unreachable LAN endpoint; case succeeds via --expect-fail inversion"
        action: "http: POST /v1/chat/completions"
        body:
          model: "local"
          messages:
            - role: "user"
              content: "HXC-243 endpoint-contract probe: reply with the single word PONG"
          max_tokens: 8
          temperature: 0
        # HXC-243: an explicit expectation is what makes this step falsifiable.
        # 200 alone is NOT enough — a wrong service can answer 200 with an error
        # envelope, so the json_path additionally demands a REAL completion body.
        expect_status: 200
        expect_json_path: "$.choices[0].message.content"
        expected: >-
          pass==false, error is non-empty ("connection refused" class),
          http_status==0 (no response ever received); case_result==true
          because this case declares --expect-fail.

  # ==========================================================================
  # NETPROV-SELF-VALIDATE-001 (mandatory §11.4.107(10)) — TWO cases, ONE
  # analyzer, proving the FACT-MATCHING discriminator (distinct from the
  # LAN-check discriminator proven above) itself cannot bluff.
  # ==========================================================================
  - id: NETPROV-SELF-VALIDATE-001-GOOD
    challenge_id: helixagent.network_provider.self-validate-golden-good
    name: "Self-validation golden-good: correct facts over the real LAN endpoint PASS"
    category: functional
    priority: critical
    platforms: [api]
    domains: [network-provider, llm, anti-bluff]
    dispatches_to: >-
      bin/helixqa-verify-netprov
      --endpoint http://10.6.100.221:18434/v1/chat/completions
      --model /models/Qwen3-Coder-30B-A3B-Instruct-Q4_K_M.gguf
      --prompt "What is 17 + 25? Reply with only the number."
      --expect "42"
      --require-lan
      --out qa-results/helixllm_network_provider/self_validate_001_golden_good_verdict.json
      --conduit-dir qa-results/helixllm_network_provider/conduit
      --challenge-id NETPROV-SELF-VALIDATE-001-GOOD
    required_evidence:
      - "qa-results/helixllm_network_provider/self_validate_001_golden_good_verdict.json | json:case_result==true | json:pass==true | json:matched_facts==1"
    steps:
      - name: "Golden-good: analyzer must PASS when facts genuinely match over the real LAN endpoint"
        action: "http: POST /v1/chat/completions"
        body:
          model: "local"
          messages:
            - role: "user"
              content: "HXC-243 endpoint-contract probe: reply with the single word PONG"
          max_tokens: 8
          temperature: 0
        # HXC-243: an explicit expectation is what makes this step falsifiable.
        # 200 alone is NOT enough — a wrong service can answer 200 with an error
        # envelope, so the json_path additionally demands a REAL completion body.
        expect_status: 200
        expect_json_path: "$.choices[0].message.content"
        expected: "pass==true (facts genuinely present in the model's LAN-routed response)."

  - id: NETPROV-SELF-VALIDATE-001-BAD
    challenge_id: helixagent.network_provider.self-validate-golden-bad-must-fail
    name: "Self-validation golden-bad: mismatched facts over the SAME LAN endpoint MUST FAIL raw, case succeeds via --expect-fail"
    category: functional
    priority: critical
    platforms: [api]
    domains: [network-provider, llm, anti-bluff]
    dispatches_to: >-
      bin/helixqa-verify-netprov
      --endpoint http://10.6.100.221:18434/v1/chat/completions
      --model /models/Qwen3-Coder-30B-A3B-Instruct-Q4_K_M.gguf
      --prompt "What is 17 + 25? Reply with only the number."
      --expect "99"
      --require-lan
      --expect-fail
      --out qa-results/helixllm_network_provider/self_validate_001_golden_bad_verdict.json
      --conduit-dir qa-results/helixllm_network_provider/conduit
      --challenge-id NETPROV-SELF-VALIDATE-001-BAD
    metadata:
      expect_fail: true
      mutation_proof: >-
        Authored 2026-07-08: with the analyzer's fact-matching assertion
        intact, this case's raw pass=false (matched_facts=0/1, the model
        genuinely answers "42" not "99") and case_result=true (via
        --expect-fail inversion) — exit 0. A paired §1.1 mutation replacing
        the Pass computation with an unconditional "v.Pass = true &&
        v.LANCheckPass" (i.e. dropping the fact-match/hallucination
        conjuncts) was applied to
        cmd/helixqa-verify-netprov/main.go, rebuilt, and re-run against
        this exact fixture: raw pass flipped to true, case_result flipped
        to false — exit 1 (case FAIL). The mutation was then reverted and
        the restored binary re-confirmed to discriminate correctly (raw
        pass=false, case_result=true) before this bank was committed. No
        mutation code is committed anywhere in this tree (§11.4.84
        quiescence).
    required_evidence:
      - "qa-results/helixllm_network_provider/self_validate_001_golden_bad_verdict.json | json:case_result==true | json:pass==false | json:matched_facts==0"
    steps:
      - name: "Golden-bad: analyzer must reject mismatched facts (raw FAIL) over the real LAN endpoint; case succeeds via --expect-fail inversion"
        action: "http: POST /v1/chat/completions"
        body:
          model: "local"
          messages:
            - role: "user"
              content: "HXC-243 endpoint-contract probe: reply with the single word PONG"
          max_tokens: 8
          temperature: 0
        # HXC-243: an explicit expectation is what makes this step falsifiable.
        # 200 alone is NOT enough — a wrong service can answer 200 with an error
        # envelope, so the json_path additionally demands a REAL completion body.
        expect_status: 200
        expect_json_path: "$.choices[0].message.content"
        expected: >-
          pass==false (the response genuinely does NOT contain "99" — it
          correctly answers "42"); case_result==true because this case
          declares --expect-fail. A case_result==false here would mean the
          analyzer bluff-PASSed a deliberately wrong fixture.
