#
# HelixQA Test Bank: Music Album & Track Browsing
# Tests music album browsing, track listing, search, and favorites
# lifecycle against REAL catalog data discovered from NAS shares.
#
# Anti-bluff per Helix Constitution §11.4 / §11.4.27 / §11.4.69 / §11.4.98:
# every step drives a real /api/v1 endpoint over live HTTP and scores PASS
# only on positive captured evidence.

version: "1.0"
name: "Catalogizer Media Music - Album & Track Browsing"
description: "Full-automation API challenge bank proving music_album browse,
  entity detail resolve, search filtering by music type, and favorites
  lifecycle work end-to-end against REAL catalog content from real NAS SMB
  shares. Each challenge drives a REAL /api/v1 endpoint over live HTTP and
  scores PASS only on positive captured evidence. Anti-bluff per Helix
  Constitution 11.4 / 11.4.27 / 11.4.69 / 11.4.98 / 11.4.135 / 11.4.146:
  no mocks, no tautologies, no metadata-only PASS; an unreachable API or
  no music items seeded yields SKIP-with-reason (11.4.3), never a
  fabricated PASS."
metadata:
  author: vasic-digital
  app: Catalogizer
  version: "1.0.0"
  guards_surface: media-music-browse-play
  evidence_root: qa-results/media-music
  endpoints_source: catalog-api/main.go
test_cases:
  - id: MUS-API-001
    name: "Browse music_album entities returns at least one real album"
    category: functional
    priority: critical
    platforms: [api]
    steps:
      - name: "Browse music_album type"
        action: "http: GET /api/v1/entities/browse/music_album?limit=50"
        expected: "200 OK; body carries items[] array with >= 1 music_album entity (each with id, title, and media_type music_album)"
        auth: admin
        expect_status: 200
    tags: [music, album, browse, resolve, regression-guard, anti-bluff]
    estimated_duration: 6s
    expected_result: "PASS only when response lists >= 1 music_album entity; honest SKIP if none seeded"

  - id: MUS-API-002
    name: "Browse music_album returns items with id and title fields"
    category: functional
    priority: critical
    platforms: [api]
    steps:
      - name: "Browse music_album to verify item shape"
        action: "http: GET /api/v1/entities/browse/music_album?limit=5"
        expected: "200 OK with items[] array where each item has id (numeric) and title (non-empty string)"
        auth: admin
        expect_status: 200
    tags: [music, album, detail, shape, regression-guard, anti-bluff]
    estimated_duration: 6s
    expected_result: "PASS only when browse returns items with valid id and title fields"

  - id: MUS-API-003
    name: "Entity search for music_album type returns filtered results"
    category: functional
    priority: medium
    platforms: [api]
    steps:
      - name: "Search entities filtered by music_album type"
        action: "http: GET /api/v1/entities/search?type=music_album&limit=20"
        expected: "200 OK with items[] containing music_album entities (each with media_type music_album) or empty array with valid shape"
        auth: admin
        expect_status: 200
    tags: [music, album, search, filter, anti-bluff]
    estimated_duration: 5s
    expected_result: "PASS only when search returns filtered results with valid shape; empty is honest SKIP"

  - id: MUS-API-004
    name: "Browse media/stats includes music_album counts"
    category: functional
    priority: medium
    platforms: [api]
    steps:
      - name: "Request media stats (may take >30s due to DB scan)"
        action: "http: GET /api/v1/media/stats"
        expected: "200 OK with JSON containing a stats object with media type breakdown; 504 timeout is an honest SKIP as the endpoint aggregates across all types"
        auth: admin
        expect_status: 200
    tags: [music, stats, media, type-count, anti-bluff]
    estimated_duration: 45s
    expected_result: "PASS only when /media/stats returns valid stats JSON; timeout is honest SKIP per 11.4.3"

  - id: MUS-API-005
    name: "Entity types list includes music_album among types"
    category: functional
    priority: medium
    platforms: [api]
    steps:
      - name: "List all entity types"
        action: "http: GET /api/v1/entities/types"
        expected: "200 OK with items[] containing music_album in the type list"
        auth: admin
        expect_status: 200
    tags: [music, types, entity, registry, anti-bluff]
    estimated_duration: 4s
    expected_result: "PASS only when entity types list includes music_album"

  - id: MUS-API-006
    name: "Browse albums with limit=5 pagination"
    category: functional
    priority: medium
    platforms: [api]
    steps:
      - name: "Browse music_album with limit=5"
        action: "http: GET /api/v1/entities/browse/music_album?limit=5&offset=0"
        expected: "200 OK with items[] array length <= 5 and total field present"
        auth: admin
        expect_status: 200
    tags: [music, album, pagination, limit, anti-bluff]
    estimated_duration: 4s
    expected_result: "PASS only when limit=5 is honoured (<= 5 items)"

  - id: MUS-API-007
    name: "Search music albums by title keyword 'Live'"
    category: functional
    priority: high
    platforms: [api]
    steps:
      - name: "Search albums by keyword Live"
        action: "http: GET /api/v1/entities/search?type=music_album&q=Live&limit=20"
        expected: "200 OK; items[] with music_album entities matching 'Live' or empty valid array"
        auth: admin
        expect_status: 200
    tags: [music, album, search, keyword, anti-bluff]
    estimated_duration: 5s
    expected_result: "PASS only when keyword search returns valid response shape"

  - id: MUS-API-008
    name: "Year-filtered browse of music albums for 2024"
    category: functional
    priority: medium
    platforms: [api]
    steps:
      - name: "Search music_album by year 2024"
        action: "http: GET /api/v1/entities/search?type=music_album&year=2024&limit=20"
        expected: "200 OK; items[] music_album entities from 2024 or empty valid array"
        auth: admin
        expect_status: 200
    tags: [music, album, year, filter, anti-bluff]
    estimated_duration: 4s
    expected_result: "PASS only when year-filtered search returns valid shape"

  - id: MUS-API-009
    name: "List albums from generic /entities endpoint"
    category: functional
    priority: medium
    platforms: [api]
    steps:
      - name: "List all entities filtered to music_album type"
        action: "http: GET /api/v1/entities?type=music_album&limit=20"
        expected: "200 OK with items[] array and total field"
        auth: admin
        expect_status: 200
    tags: [music, album, entities, list, anti-bluff]
    estimated_duration: 4s
    expected_result: "PASS only when /entities?type=music_album returns valid shape"

  - id: MUS-API-010
    name: "Browse popular media and verify response shape"
    category: functional
    priority: medium
    platforms: [api]
    steps:
      - name: "Request popular media"
        action: "http: GET /api/v1/media/popular?limit=20"
        expected: "200 OK with items[] array containing media items or empty valid array"
        auth: admin
        expect_status: 200
    tags: [music, media, popular, browse, anti-bluff]
    estimated_duration: 4s
    expected_result: "PASS only when /media/popular returns valid response shape"
