  # --- §M.M3 IEC61937 HDMI passthrough (ships INERT default=never; opt-in force path) ---

  - id: audio.passthrough.m-m3-iec61937-force
    challenge_id: audio.passthrough.m-m3-iec61937-force
    name: "§M.M3 IEC61937 HDMI passthrough opt-in (force) — Arvus compressed-codec proof, default stays never"
    category: functional
    priority: medium
    platforms: [android]
    dispatches_to: "device/rockchip/rk3588/tests/test_ac3_decode.sh"
    domains: [audio, passthrough, iec61937, hdmi, arvus]
    required_evidence: [getprop-passthrough-default-never, arvus-codec-in-use-compressed, arvus-codec-in-use-revert-never]
    steps:
      - name: "Verify shipped default is never (Fix #137 INERT)"
        action: "getprop persist.atmosphere.audio.passthrough — expect empty / never (Fix #112 §EM LPCM path is the active default)"
        expected: "Default never per docs/audio/m_m3_passthrough_decision.md — passthrough is opt-in ONLY; default-on would be a zero-regression violation"
      - name: "Opt into forced passthrough + play compressed content"
        action: "setprop persist.atmosphere.audio.passthrough force; play AC3/E-AC3/DTS; probe Arvus Codec-In-Use"
        expected: "Arvus Codec-In-Use shows DD / DD+ / DTS (compressed codec, NOT PCM) per §11.4.13 / §11.4.68"
      - name: "Revert to never + cleanup (§11.4.14)"
        action: "setprop persist.atmosphere.audio.passthrough never; stop playback; re-probe Arvus Codec-In-Use"
        expected: "Default never restored; Codec-In-Use returns to N.E.; device left quiescent per §11.4.14"
    tags: [audio, passthrough, iec61937, hdmi, arvus, "§M.M3", "fix-137", "§11.4.13", "§11.4.14", "§11.4.68", "§11.4.69", "§11.4.72", audio_output]
    documentation_refs:
      - type: plan
        section: "Audio burn-down §M.M3 IEC61937 passthrough (ship-inert)"
        path: "docs/research/issues_triage_2026_05_30/audio_burndown_playbook.md"
      - type: design
        section: "M.M3 passthrough decision (default flipped auto→never)"
        path: "docs/audio/m_m3_passthrough_decision.md"
    estimated_duration: "120s"
    expected_result: "Shipped default is never (LPCM path active); on opt-in force, Arvus Codec-In-Use shows a compressed codec (DD/DD+/DTS), then reverts to never with Codec-In-Use back to N.E. PASS only on the compressed-codec sink-side capture during force; Arvus unreachable is SKIP topology_unsupported."

