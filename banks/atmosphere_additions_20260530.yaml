#
# PURPOSE: §11.4.4(b) layer-4 (HelixQA Challenge) coverage for the cohort-c
#   post-flash-closeable items + recently-hardened audio/video tests that LACK a
#   Challenge entry in banks/atmosphere.yaml. A bank entry without Challenge
#   coverage is a §11.4 PASS-bluff; these entries close that gap.
#
# DO NOT MERGE BY EDITING THIS FILE INTO atmosphere.yaml MANUALLY here — the
#   conductor merges these `test_cases:` list items serially into the live bank's
#   `test_cases:` sequence to avoid §11.4.58 cross-PWU contention. This file is a
#   staging draft ONLY.
#
# SCHEMA: matches the newer richer entries in atmosphere.yaml (challenge_id +
#   dispatches_to + domains + required_evidence + §11.4.69 taxonomy tags), NOT the
#   legacy VR-xxx `steps`-only style. Every dispatches_to was verified to EXIST in
#   device/rockchip/rk3588/tests/ on 2026-05-30. Every required_evidence cites the
#   §11.4.69 sink-side captured-evidence taxonomy (audio_output / video_display /
#   display_topology / subtitle_render / cast / touch_input). PASS only on positive
#   captured evidence per §11.4.5 / §11.4.13 / §11.4.68 / §11.4.69; sink-unreachable
#   → SKIP topology_unsupported (never FAIL); geo-blocked → SKIP geo_restricted.
#
# ANTI-BLUFF NOTE (§11.4.6): items marked CAF in the playbooks are CLOSEABLE-after-
#   flash. The multichannel trio (§GN/§GT/§AV) PASS requires a NON-STEREO fixture +
#   Arvus awake — a multichannel PASS against a stereo fixture is the keystone bluff.
#   These Challenges encode that requirement in their required_evidence + steps.

test_cases:

  # ==================== AUDIO (§11.4.72 top-priority) ====================

  # --- §GN / §GT / §AV multichannel HDMI trio (one E2E run closes all three) ---

  - id: audio.multichannel.5-1-hdmi-end-to-end
    challenge_id: audio.multichannel.5-1-hdmi-end-to-end
    name: "5.1/7.1 multichannel HDMI end-to-end — §GN/§GT/§AV trio, non-stereo fixture + Arvus sink"
    category: functional
    priority: critical
    platforms: [android]
    dispatches_to: "device/rockchip/rk3588/tests/test_5_1_multichannel_hdmi_end_to_end.sh"
    domains: [audio, multichannel, hdmi, arvus]
    required_evidence: [hw-params-channels-6-or-8, ffprobe-channels-5-1-or-7-1, audio-flinger-frames-written-advance, arvus-codec-in-use-non-stereo, no-xrun-census]
    steps:
      - name: "Verify NON-STEREO multichannel fixture present"
        action: "Confirm device/rockchip/rk3588/tests/assets/audio/ holds a 6-/8-channel WAV (NOT the stereo A3 fixture) before trusting any 5.1 PASS"
        expected: "Multichannel fixture present — a multichannel PASS against a stereo fixture is the §GN/§GT/§AV keystone bluff (§11.4.6)"
      - name: "Run multichannel HDMI end-to-end test"
        action: "adb_shell: sh /data/local/tmp/tests/test_5_1_multichannel_hdmi_end_to_end.sh"
        expected: "5.1/7.1 content decodes to multichannel LPCM and reaches the HDMI sink (Fix #112 §EM LPCM path)"
      - name: "Verify on-SoC channel-count evidence"
        action: "Read /proc/asound/card0/pcm0p/sub0/hw_params DURING playback — expect channels: 6 (or 8), NOT 2; confirm dumpsys media.audio_policy HDMI Port masks 0x003f (5.1) / 0x063f (7.1)"
        expected: "HAL direct-output reports 6/8 channels; AudioFlinger frames-written advancing; zero XRUN per §11.4.5"
      - name: "Verify Arvus sink-side codec (§11.4.13 / §11.4.68)"
        action: "Probe Arvus Codec-In-Use — expect a NON-stereo value (Multi-CH PCM / PCM6 / 5.1 / 7.1)"
        expected: "Arvus Codec-In-Use is non-stereo per §11.4.69 audio_output taxonomy — empty / PCM2 is a §11.4 PASS-bluff; Arvus unreachable → SKIP topology_unsupported"
    tags: [audio, multichannel, hdmi, "5.1", "7.1", arvus, "§GN", "§GT", "§AV", "§11.4.5", "§11.4.13", "§11.4.68", "§11.4.69", "§11.4.72", audio_output, cohort-c-caf]
    documentation_refs:
      - type: plan
        section: "Audio burn-down §GN/§GT/§AV multichannel cluster"
        path: "docs/research/issues_triage_2026_05_30/audio_burndown_playbook.md"
      - type: architecture
        section: "Fix #112 / Fix #136 §EM"
        path: "docs/guides/MULTICHANNEL_AUDIO_ARCHITECTURE.md"
      - type: guide
        section: "Arvus Codec-In-Use sink-side evidence"
        path: "docs/guides/ARVUS_HDMI_INTEGRATION.md"
    estimated_duration: "120s"
    expected_result: "5.1/7.1 content reaches the HDMI sink as multichannel LPCM: hw_params channels 6/8, AudioFlinger frames-written advancing, zero XRUN, and Arvus Codec-In-Use shows a non-stereo codec. Closes §GN + §GT + §AV in one run. PASS only on the non-stereo sink-side capture; stereo Codec-In-Use is FAIL; Arvus unreachable is SKIP topology_unsupported."

  - id: audio.multichannel.5-1-arvus-autonomous
    challenge_id: audio.multichannel.5-1-arvus-autonomous
    name: "5.1 multichannel Arvus autonomous E2E — sink-side codec ground truth (§GN/§GT/§AV)"
    category: functional
    priority: critical
    platforms: [android]
    dispatches_to: "device/rockchip/rk3588/tests/test_5_1_arvus_e2e_autonomous.sh"
    domains: [audio, multichannel, arvus, sink-side]
    required_evidence: [arvus-codec-in-use-non-stereo, arvus-codec-in-use-transition, hal-frames-written, no-xrun-census]
    steps:
      - name: "Verify Arvus reachable + identity-matched (§11.4.13)"
        action: "Host arvus_probe.sh — Arvus AVR awake + MAC OUI match before consuming codec-state"
        expected: "Arvus reachable + identity verified; unreachable → SKIP topology_unsupported (never FAIL per §11.4.13 / §FW)"
      - name: "Run autonomous 5.1 Arvus E2E test"
        action: "adb_shell: sh /data/local/tmp/tests/test_5_1_arvus_e2e_autonomous.sh"
        expected: "Autonomous 5.1 playback drives the HDMI sink; no human present to observe (§11.4.52)"
      - name: "Assert sink-side codec transitioned to multichannel"
        action: "Capture Arvus Codec-In-Use during 5.1 window — expect non-stereo; assert value CHANGED from the quiescent / stereo baseline"
        expected: "Codec-In-Use non-stereo during playback per §11.4.68; empty Codec-In-Use is FAIL"
      - name: "Anti-stickiness post-stop"
        action: "After STOP re-probe Arvus Codec-In-Use — assert it returned to N.E."
        expected: "Codec-In-Use returns to N.E. per §11.4.13 anti-stickiness; §11.4.14 cleanup verified"
    tags: [audio, multichannel, arvus, sink-side, autonomous, "§GN", "§GT", "§AV", "§11.4.13", "§11.4.52", "§11.4.68", "§11.4.69", "§11.4.72", audio_output, cohort-c-caf]
    documentation_refs:
      - type: plan
        section: "Audio burn-down §GN/§GT/§AV — Top-3 #1 multichannel HDMI E2E"
        path: "docs/research/issues_triage_2026_05_30/audio_burndown_playbook.md"
      - type: guide
        section: "Arvus Codec-In-Use sink-side evidence"
        path: "docs/guides/ARVUS_HDMI_INTEGRATION.md"
    estimated_duration: "120s"
    expected_result: "Autonomous 5.1 playback drives the Arvus sink to a non-stereo Codec-In-Use that CHANGED from baseline and returned to N.E. after stop. PASS only on the live non-stereo sink-side capture; empty Codec-In-Use is FAIL; Arvus unreachable is SKIP topology_unsupported."

