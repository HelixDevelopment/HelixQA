        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer

    PaginatedResponse_ProviderConfig:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProviderConfig'
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer

    PaginatedResponse_ExchangeRate:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ExchangeRate'
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer

    PaymentMethod:
      type: object
      description: Tokenized payment instrument. Never stores raw card data.
      properties:
        id:
          type: string
          format: uuid
        merchant_id:
          type: string
          format: uuid
        customer_id:
          type: string
          format: uuid
          description: Associated customer (nullable for merchant defaults)
        type:
          type: string
          enum: [card, bank_account, wallet]
        provider:
          type: string
          enum: [stripe, paypal, square]
        provider_token:
          type: string
          description: Provider-specific token (internal-only)
        fingerprint:
          type: string
          description: Card fingerprint for dedup
        brand:
          type: string
          description: Card brand (visa, mastercard)
        last4:
          type: string
          description: Last 4 digits of card
        exp_month:
          type: integer
          description: Expiration month
        exp_year:
          type: integer
          description: Expiration year
        is_default:
          type: boolean
          description: Default payment method
        metadata:
          type: object
          description: Custom data
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    User:
      type: object
      description: System user with role-based access
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [root_admin, account_admin, user]
        merchant_id:
          type: string
          format: uuid
          description: Associated merchant (nullable for root_admin)
        is_active:
          type: boolean
        mfa_enabled:
          type: boolean
          description: Whether MFA is enabled
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AuditLog:
      type: object
      description: Immutable audit trail for all actions (internal-only, not exposed in public API)
      properties:
        id:
          type: string
          format: uuid
        merchant_id:
          type: string
          format: uuid
        actor_id:
          type: string
          format: uuid
        actor_type:
          type: string
          enum: [root_admin, account_admin, user, system, api_key]
        action:
          type: string
          description: Action performed (e.g., transaction.charge, merchant.update)
        resource_type:
          type: string
          description: Resource type affected
        resource_id:
          type: string
          format: uuid
        changes:
          type: object
          description: Before/after diff for updates
        ip_address:
          type: string
          description: Client IP address
        user_agent:
          type: string
          description: Client user agent
        created_at:
          type: string
          format: date-time

    ExchangeRate:
      type: object
      description: Cached exchange rate for multi-currency conversion
      properties:
        id:
          type: integer
        base_currency:
          type: string
          description: Base currency code
        quote_currency:
          type: string
          description: Quote currency code
        rate:
          type: string
          description: Exchange rate as decimal string for precision (e.g., "1.23456789")
        source:
          type: string
          description: Rate source (frankfurter, exchangerate-api, open-exchange-rates)
        fetched_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time

    # Auth Schemas
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    RegisterRequest:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        name:
          type: string
        company_name:
          type: string

    TokenPair:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Access token TTL in seconds

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    MFASetupResponse:
      type: object
      properties:
        secret:
          type: string
          description: TOTP secret (base32)
        qr_code_url:
          type: string
          description: otpauth:// URI for QR code
        recovery_codes:
          type: array
          items:
            type: string

    MFAVerifyRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 6
          maxLength: 6

    # API Key Schemas
    ApiKey:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        key_prefix:
          type: string
          description: First 8 chars for identification
        scopes:
          type: array
          items:
            type: string
        rate_limit:
          type: integer
          description: Requests per second (0 = unlimited)
        is_active:
          type: boolean
        last_used_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    CreateApiKeyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
        rate_limit:
          type: integer
          default: 0
        expires_at:
          type: string
          format: date-time
          nullable: true

    ApiKeyCreatedResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        key:
          type: string
          description: Full API key (shown once, never retrievable)
        key_prefix:
          type: string
        created_at:
          type: string
          format: date-time

